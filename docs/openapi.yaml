  /api/v1/coaches/{coachId}/availability/slots:
    get:
      tags: [Coaches]
      summary: Open appointment slots of a coach
      description: |
        ADMIN or OWNER for any coach; a COACH only for their own coach id (another coach is 403); a MEMBER is
        403 (booking is done by staff on behalf of the member).

        Returns the free start times for ONE appointment type over a date range. For each facility day in
        `from`..`to` (inclusive, at most 31 days; `to` before `from` or a longer range is 400): the coach's
        saved hours (touching slots merged) minus leave days, not-cancelled class sessions (raw time) and
        BOOKED appointments with their buffers, cut into back-to-back slots of the type's `durationMin`
        (step = duration, counted from the start of each free stretch). A slot is returned only if booking it
        would pass the same coach schedule rules as `POST /api/v1/appointments`, including the type's own
        `bufferBeforeMin` / `bufferAfterMin`. Slots that do not start in the future are never returned.
        `excludeAppointmentId` leaves that appointment out (to move it onto its own time).

        Every day of the range is present in `days`, with an empty `slots` array when nothing is free.
        `availabilityConfigured` is `false` when the coach has never saved weekly hours ("hours not set").
        Timestamps are ISO 8601 UTC; `date` is a facility calendar day in `timezone`. A slot is a suggestion:
        the booking checks again under the coach's lock, so it can still answer 409 `COACH_CONFLICT`.

        Errors: unknown coach 404 `COACH_NOT_FOUND`, unknown type 404 `APPOINTMENT_TYPE_NOT_FOUND`, inactive
        coach 409 `COACH_INACTIVE`, inactive type 409 `APPOINTMENT_TYPE_INACTIVE`.
      operationId: getCoachOpenSlots
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CoachId'
        - name: appointmentTypeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: First facility day, YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last facility day (inclusive), YYYY-MM-DD; at most 31 days after `from`
          schema:
            type: string
            format: date
        - name: excludeAppointmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The open slots, one entry per day
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoachOpenSlots'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`COACH_NOT_FOUND` or `APPOINTMENT_TYPE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Appointment type not found
                code: APPOINTMENT_TYPE_NOT_FOUND
        '409':
          description: '`COACH_INACTIVE` or `APPOINTMENT_TYPE_INACTIVE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: This coach is inactive and cannot be booked
                code: COACH_INACTIVE
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Coaches
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`.'
      operationId: methodNotAllowed_api_v1_coaches__coachId_availability_slots
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/coaches/{coachId}/availability:
    get:
      tags: [Coaches]
      summary: Get a coach's recurring weekly availability
      description: |
        ADMIN or OWNER for any coach. A COACH may read only their own week (another coach is 403).
        A MEMBER is 403.

        Always returns all 7 days in `dayOfWeek` order 1 (Monday) to 7 (Sunday). A weekday with no
        saved row is `{ isAvailable: false, slots: [] }`. A coach whose hours were never saved still
        returns 7 unavailable days, with `isConfigured: false` and `updatedAt: null`, so a client can show
        "hours not set". Times are `HH:mm` 24h facility wall-clock in `timezone`. A coach with no saved
        hours is not assignable to classes or appointments.
      operationId: getCoachWeeklyAvailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CoachId'
      responses:
        '200':
          description: The recurring week
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WeeklyAvailability'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CoachNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Coaches]
      summary: Replace a coach's recurring weekly availability
      description: |
        ADMIN or OWNER only (a COACH or MEMBER is 403).

        **PUT replaces the whole week; days must contain exactly 7 entries (dayOfWeek 1-7, each once). Unavailable day = { dayOfWeek, isAvailable: false, slots: [] }.**

        Rules (400 `VALIDATION_ERROR`, `errors[].field` is the path, for example `days.3.slots.1.startTime`):
        a wrong number of days, a missing or repeated `dayOfWeek`, times that are not `HH:mm` 24h, an
        `endTime` that is not later than `startTime` (a range cannot cross midnight), more than 10 ranges
        in a day, an available day with no range, an unavailable day with ranges, unknown fields, and
        overlapping ranges in one day (the message names the day and both ranges). Ranges that only touch
        (09:00-12:00 and 12:00-15:00) are allowed.

        The old week is deleted and the new one inserted in one transaction, with an audit row
        (`COACH_AVAILABILITY_UPDATED`). Saving changes no class template, class session, booking or
        appointment: existing commitments stay scheduled. Slots in the response are sorted by start time.
      operationId: saveCoachWeeklyAvailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CoachId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWeeklyAvailabilityRequest'
            example:
              days:
                - dayOfWeek: 1
                  isAvailable: true
                  slots:
                    - { startTime: '06:00', endTime: '12:00' }
                    - { startTime: '16:00', endTime: '20:00' }
                - {
                    dayOfWeek: 2,
                    isAvailable: true,
                    slots: [{ startTime: '06:00', endTime: '12:00' }],
                  }
                - {
                    dayOfWeek: 3,
                    isAvailable: true,
                    slots: [{ startTime: '06:00', endTime: '12:00' }],
                  }
                - {
                    dayOfWeek: 4,
                    isAvailable: true,
                    slots: [{ startTime: '06:00', endTime: '12:00' }],
                  }
                - {
                    dayOfWeek: 5,
                    isAvailable: true,
                    slots: [{ startTime: '06:00', endTime: '12:00' }],
                  }
                - { dayOfWeek: 6, isAvailable: false, slots: [] }
                - { dayOfWeek: 7, isAvailable: false, slots: [] }
      responses:
        '200':
          description: Saved. The body is the same shape as GET.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Coach availability saved successfully
                      data:
                        $ref: '#/components/schemas/WeeklyAvailability'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CoachNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Coaches
      summary: Not supported
      description: 'Every method other than GET, PUT answers 405 with `Allow: GET, PUT`.'
      operationId: methodNotAllowed_api_v1_coaches__coachId_availability
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, PUT`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, PUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/plans:
    get:
      tags: [Plans]
      summary: List and search membership plans
      description: |
        OWNER, ADMIN or COACH. A MEMBER receives 403 Forbidden.

        Returns one page of plans in the short list form, plus a top-level `counts` for the two
        section tabs. Every filter is optional and filters combine with AND.

        **Archived plans** are hidden by default (only `active` and `inactive` are returned).
        They appear only when `status` includes `archived`.

        **Search (`q`)** is case-insensitive and matches the plan name, the description and the
        kind label (`Subscription`, `Credit pack`, `Single visit`, `Trial`).

        **Sorting** accepts `name` (default, ignores letter case), `price` or `createdAt`;
        a leading `-` sorts descending (`-price` = most expensive first).

        **`counts`** is the number of non-archived plans per section. It ignores `q`, every
        filter and `status`, so the tab badges do not change while searching or filtering.

        **Unknown query parameters are ignored**, so web and mobile clients can add parameters
        without breaking. The trade-off: a misspelled parameter name (for example
        `sections=online_coaching`) is silently dropped and the filter is not applied. A known
        parameter with an invalid value returns 400.

        `activeClientCount` is a placeholder and is always `0`.
      operationId: listPlans
      security:
        - bearerAuth: []
      parameters:
        - name: section
          in: query
          description: Omit to get both sections
          schema:
            $ref: '#/components/schemas/PlanSection'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/PlanKind'
        - name: creditType
          in: query
          schema:
            $ref: '#/components/schemas/PlanCreditType'
        - name: visibility
          in: query
          schema:
            $ref: '#/components/schemas/PlanVisibility'
        - name: status
          in: query
          description: |
            Comma-separated list, for example `active,inactive` or `archived`.
            Default: `active,inactive`. Archived plans are returned only when `archived` is listed.
          schema:
            type: string
            example: active,inactive
        - name: q
          in: query
          description: Search text, at most 100 characters; blank means no search
          schema:
            type: string
            maxLength: 100
            example: nutrition
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: '`name`, `price` or `createdAt`; prefix with `-` for descending'
          schema:
            type: string
            enum: [name, -name, price, -price, createdAt, -createdAt]
            default: name
      responses:
        '200':
          description: One page of plans
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - pagination
                      - counts
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlanListItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      counts:
                        $ref: '#/components/schemas/PlanSectionCounts'
        '400':
          description: A known query parameter has an invalid value (returns all failing fields together)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: section
                    message: 'Section must be one of: class_membership, online_coaching'
                  - field: limit
                    message: Limit must be a whole number between 1 and 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      tags: [Plans]
      summary: Create a membership plan
      description: |
        ADMIN or OWNER only. Creates a new active membership plan (version 1).
        Coach or Member accounts receive 403 Forbidden.
        Accepts writable fields; status is forced to `active`, externalRef is not accepted.
        Writes an audit log entry in the same transaction.
      operationId: createPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Plan created successfully
          headers:
            Location:
              description: Relative path to the newly created plan
              schema:
                type: string
                example: /api/v1/plans/e0f06822-2615-4ba7-a9a3-559d81d4546d
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Membership plan created successfully
                      data:
                        $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Validation failed (returns all failing fields together)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: price
                    message: Price is required and must be at least 0
                  - field: billingCycle
                    message: Only a membership renews monthly.
                  - field: creditsIncluded
                    message: creditsIncluded must be 0 when creditType is TIME
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A non-archived plan with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: A membership plan with this name already exists
                code: PLAN_DUPLICATE_NAME
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Plans
      summary: Not supported
      description: 'Every method other than GET, POST answers 405 with `Allow: GET, POST`.'
      operationId: methodNotAllowed_api_v1_plans
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [Plans]
      summary: Get one membership plan
      description: |
        OWNER, ADMIN or COACH. A MEMBER receives 403 Forbidden.

        Returns the full plan in the same shape as the create response, including archived
        plans. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404.

        `activeClientCount` is a placeholder and is always `0` until purchases exist.
      operationId: getPlan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlanDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Plans]
      summary: Update a membership plan (partial)
      description: |
        OWNER or ADMIN only; a COACH or MEMBER receives 403. Send only the fields to change.

        **Check order:** 401/403, 429, 404, 409 `PLAN_ARCHIVED`, 400 (fields that cannot be
        edited), 400 (the merged result), 409 `PLAN_DUPLICATE_NAME`, 409 `PLAN_IN_USE`, then the
        update.

        **Validation** runs on the stored plan with the sent fields laid over it, using the same
        rules as create. So a change that is only valid together with another field (for example
        switching `creditType` to `time` also needs `creditsIncluded: 0` and `creditRefill: null`)
        must send both.

        **Not editable (400):** `id`, `section`, `status` (use `PATCH /api/v1/plans/{id}/status`),
        `version`, `externalRef`, `createdAt`, `updatedAt`. Unknown fields and an empty body are
        also 400.

        **Versioning:** `version` goes up by 1 when any commercial field changes (`price`,
        `billingCycle`, `creditType`, `creditsIncluded`, `creditRefill`, `validityValue`,
        `validityUnit`, `term`, `recurring`, `periodMonths`, `joiningFee`), however many change in one request. Changing only other fields keeps the
        version. A purchase keeps the version it was bought on, so a price change applies from
        the next billing cycle. Sending a field with its current value changes nothing: no
        version bump, no audit entry, and the current plan is returned.

        **Conflicts (409):** `PLAN_ARCHIVED` (archived plans cannot be edited), `PLAN_DUPLICATE_NAME`
        (another non-archived plan has the name, case-insensitive), `PLAN_IN_USE` (switching
        between time-based and credit-based while the plan has active clients).

        The update, the version bump and the audit entry (changed fields with old and new values)
        happen in one transaction.
      operationId: updatePlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: The plan after the update
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Membership plan updated successfully
                      data:
                        $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Validation failed (returns all failing fields together)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: status
                    message: 'Status cannot be edited here, use PATCH /api/v1/plans/:id/status'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: |
            `PLAN_ARCHIVED`, `PLAN_DUPLICATE_NAME` or `PLAN_IN_USE`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                archived:
                  value:
                    success: false
                    message: An archived membership plan cannot be edited
                    code: PLAN_ARCHIVED
                duplicateName:
                  value:
                    success: false
                    message: A membership plan with this name already exists
                    code: PLAN_DUPLICATE_NAME
                inUse:
                  value:
                    success: false
                    message: Time-based and credit-based plans cannot be switched while clients are using the plan
                    code: PLAN_IN_USE
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Plans]
      summary: Not supported (plans are archived, never deleted)
      description: |
        Always answers 405 with `Allow: GET, PATCH`, also without a token. Every method other than
        GET and PATCH answers the same. To retire a plan use `PATCH /api/v1/plans/{id}/status`.
      operationId: deletePlanNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/plans/{id}/status:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    patch:
      tags: [Plans]
      summary: Change the status of a membership plan
      description: |
        OWNER or ADMIN only; a COACH or MEMBER receives 403.

        **Check order:** 401/403, 429, 404, 400 (body), then the same-status shortcut, 409
        `PLAN_INVALID_TRANSITION`, 409 `PLAN_DUPLICATE_NAME` (restoring only), then the update.

        **Allowed moves:** `active` <-> `inactive`, `active`/`inactive` -> `archived`,
        `archived` -> `inactive`. Anything else (for example `archived` -> `active`) is
        409 `PLAN_INVALID_TRANSITION`.

        **Same status again** returns 200 with the current values, changes nothing and writes no
        audit entry.

        **Restoring** an archived plan (`archived` -> `inactive`) returns 409 `PLAN_DUPLICATE_NAME`
        when another non-archived plan has taken the name meanwhile.

        Each real change writes an audit entry with `from`, `to` and `reason`. The version never
        changes. Existing clients keep their records; the purchase flow reads `status` to block
        new sales of inactive and archived plans.
      operationId: changePlanStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanStatusRequest'
      responses:
        '200':
          description: The plan's status after the request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Membership plan status updated successfully
                      data:
                        $ref: '#/components/schemas/PlanStatusResult'
        '400':
          description: Body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: status
                    message: 'Status must be one of: active, inactive, archived'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '409':
          description: '`PLAN_INVALID_TRANSITION`, or `PLAN_DUPLICATE_NAME` when restoring'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidTransition:
                  value:
                    success: false
                    message: This status change is not allowed
                    code: PLAN_INVALID_TRANSITION
                duplicateName:
                  value:
                    success: false
                    message: A membership plan with this name already exists
                    code: PLAN_DUPLICATE_NAME
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Plans]
      summary: Not supported
      description: 'Answers 405 with `Allow: PATCH`. Plans have no DELETE route.'
      operationId: deletePlanStatusNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/classes:
    get:
      tags: [Classes]
      summary: List classes
      description: |
        Available to OWNER, ADMIN, COACH, MEMBER.
        Members only see active public classes.
        Coaches see active public classes plus classes they are assigned to.
        Staff (OWNER, ADMIN) default to active classes, and can specify active=false or active=all.
      operationId: listClasses
      security:
        - bearerAuth: []
      parameters:
        - name: visibility
          in: query
          description: Filter by visibility (public | private)
          schema:
            type: string
            enum: [public, private]
        - name: active
          in: query
          description: Filter by active status (true | false | all). Defaults to true for staff.
          schema:
            type: string
            enum: [true, false, all]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of classes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - pagination
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassResponse'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Classes]
      summary: Create a class
      description: |
        Available to OWNER, ADMIN.
        Public classes require >= 1 eligiblePlanIds. Private classes may have none.

        Sending `classPassEnabled: true` needs the studio rule `CLASSPASS_ACCEPT` (see
        `/settings/booking-rules`) to be on (it is on by default); otherwise 409
        `CLASSPASS_NOT_ACCEPTED`.
      operationId: createClass
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: Class created successfully
          headers:
            Location:
              description: URI of the newly created class
              schema:
                type: string
                example: /api/v1/classes/62d97cd0-0000-4000-8000-000000000001
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Class created successfully
                  data:
                    $ref: '#/components/schemas/ClassResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Class with this name already exists (`CLASS_DUPLICATE_NAME`), or ClassPass is not accepted (`CLASSPASS_NOT_ACCEPTED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                duplicateName:
                  value:
                    success: false
                    message: A class with this name already exists
                    code: CLASS_DUPLICATE_NAME
                classPassNotAccepted:
                  value:
                    success: false
                    message: ClassPass is not accepted at this studio
                    code: CLASSPASS_NOT_ACCEPTED
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Classes
      summary: Not supported
      description: 'Every method other than GET, POST answers 405 with `Allow: GET, POST`.'
      operationId: methodNotAllowed_api_v1_classes
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/classes/{id}:
    get:
      tags: [Classes]
      summary: Get class by ID
      description: |
        Available to all authenticated roles.
        Members only see active public classes.
        Coaches see active public classes or assigned classes.
      operationId: getClass
      security:
        - bearerAuth: []
