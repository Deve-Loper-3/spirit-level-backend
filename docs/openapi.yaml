  /api/v1/appointments/{appointmentId}/cancel:
    post:
      tags: [Appointments]
      summary: Cancel an appointment
      description: |
        ADMIN or OWNER only. No request body. `BOOKED` becomes `CANCELLED`, `cancelledAt` is set and
        `version` goes up by one, together with an audit row (`APPOINTMENT_CANCELLED`), in one transaction.

        Cancelling twice is 409 `APPOINTMENT_ALREADY_CANCELLED`. An appointment whose `startAt` is now or in
        the past cannot be cancelled: 409 `APPOINTMENT_PAST_IMMUTABLE`. Cancelling has no other effect (no
        credit, notification or e-mail) in this version.
      operationId: cancelAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Appointment cancelled successfully
                      data:
                        $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AppointmentNotFound'
        '409':
          $ref: '#/components/responses/AppointmentCancelConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Appointments
      summary: Not supported
      description: 'Every method other than POST answers 405 with `Allow: POST`.'
      operationId: methodNotAllowed_api_v1_appointments__appointmentId_cancel
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      description: |
        Any signed-in role (OWNER, ADMIN, COACH, MEMBER). Only the caller's own notifications, newest first.
        `unread=true` keeps the unread ones (`false` or omitted: all). Unknown query parameters are 400.
        `readAt` is `null` while a notification is unread; timestamps are ISO 8601 UTC. Today the only type is
        `CLASS_CANCELLED` (`data` holds `sessionId`, `classId` and `startAt`).
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          description: '`true` keeps only unread notifications (lowercase `true` / `false`)'
          schema:
            type: string
            enum: ['true', 'false']
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [pagination]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Notifications
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`.'
      operationId: methodNotAllowed_api_v1_notifications
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
