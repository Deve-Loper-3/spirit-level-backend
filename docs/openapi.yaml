                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Category created successfully
                      data:
                        $ref: '#/components/schemas/CafeCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CafeCategoryExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: |
        Every method other than GET and POST answers 405 with `Allow: GET, POST`, also without
        a token. Documented once here under PUT; PATCH and DELETE behave the same.
      operationId: cafeCategoriesMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedCollection'

  /api/v1/cafe/categories/{categoryId}:
    parameters:
