      description: |
        OWNER or ADMIN: every session. A COACH: only the sessions where THEY are on leave (a `coachId` of
        another coach is 403, a coach without a profile is 403). A MEMBER is 403.

        Lists the not-cancelled class sessions that start in `from`..`to` (inclusive facility days, at most 31
        days, `to` before `from` is 400) and have at least one assigned coach on leave on the session's
        facility day. Sorted by `startAt`. `coachId` keeps the sessions where that coach is on leave;
        `classId` keeps one class. Paged in memory after filtering (`pagination.total` is the number of
        matching sessions).

        `unavailableCoaches` are the assigned coaches on leave that day, with the leave that covers it.
        `coverage` is `COVERED` when at least one assigned coach is NOT on leave that day (they are listed in
        `coveringCoaches`), otherwise `UNCOVERED` (`coveringCoaches` is empty). This is the same definition as
        `affectedSessions` of the leave endpoints. Read only: it never changes a session, a booking or a leave.
        The existing `GET /api/v1/sessions` response is unchanged.
