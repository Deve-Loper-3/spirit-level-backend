  /api/v1/appointment-types/{typeId}:
    patch:
      tags: [Appointments]
      summary: Edit or deactivate an appointment type
      description: |
        ADMIN or OWNER only. Any subset of `name`, `durationMin`, `bufferBeforeMin`, `bufferAfterMin`,
        `isActive`; at least one field (an empty body is 400 with `errors[].field` = `body`). There is no
        DELETE: set `isActive: false` to retire a type. Re-activating a type, or renaming an active one, to
        a name already used by another ACTIVE type is 409 `APPOINTMENT_TYPE_NAME_TAKEN`.

        **Existing appointments never change:** each appointment keeps its own copy (snapshot) of the buffers
        and its own start and end, so editing a type only affects appointments booked afterwards. A request
        that changes nothing returns the type unchanged and writes no audit row; otherwise
        `APPOINTMENT_TYPE_UPDATED` (changed fields, before and after) is written in the same transaction.
      operationId: updateAppointmentType
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentTypeRequest'
            example:
              durationMin: 45
              isActive: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Appointment type updated successfully
                      data:
                        $ref: '#/components/schemas/AppointmentType'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AppointmentTypeNotFound'
        '409':
          $ref: '#/components/responses/AppointmentTypeConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Appointments
      summary: Not supported
      description: 'Every method other than PATCH answers 405 with `Allow: PATCH`.'
      operationId: methodNotAllowed_api_v1_appointment_types__typeId
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      description: |
        Sorted by `startAt`, then `id`. ADMIN and OWNER see every appointment. A COACH is limited to their
        own (`coachId` is forced to their coach id; asking for another coach is 403) and a MEMBER to their
        own (`memberId` is forced to themselves; asking for another member is 403). A COACH with no coach
        profile is 403.

        Filters: `coachId`, `memberId`, `state` (`BOOKED` or `CANCELLED`, uppercase), `from` (inclusive) and
        `to` (exclusive) on `startAt`, ISO 8601 with `Z` or a UTC offset; `from` must be before `to`.
        Unknown query parameters are 400. Timestamps are ISO 8601 UTC, empty fields are explicit `null`.
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: coachId
          in: query
          schema:
            type: string
            format: uuid
        - name: memberId
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentState'
        - name: from
          in: query
          description: Keep appointments starting at or after this instant (ISO 8601 with Z or offset)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Keep appointments starting before this instant (ISO 8601 with Z or offset). Must be after `from`.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of appointments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [pagination]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Appointment'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Appointments]
      summary: Book an appointment
      description: |
        ADMIN or OWNER only (booking is done on behalf of the member). Body: `coachId`, `memberId`,
        `appointmentTypeId` and `startAt` (ISO 8601 with `Z` or a UTC offset); unknown fields are 400.

        `endAt` = `startAt` + the type's `durationMin`. The type's `bufferBeforeMin` and `bufferAfterMin`
        are copied onto the appointment (snapshot). The new appointment is `BOOKED` with `version` 1.

        Checks, in order: validation and `startAt` in the future (400, `errors[].field` = `startAt`); the
        coach, the member (a user with role MEMBER) and the type exist (404 `COACH_NOT_FOUND`,
        `MEMBER_NOT_FOUND`, `APPOINTMENT_TYPE_NOT_FOUND`); the coach is active, the member account is active
        and the type is active (409 `COACH_INACTIVE`, `MEMBER_NOT_ACTIVE`, `APPOINTMENT_TYPE_INACTIVE`).

        The write runs in one transaction under a per-coach lock and runs the coach schedule check
        (`assertIntervalAssignable`). The first rule that fails answers 409 `COACH_CONFLICT`, in this order:
        weekly availability (`AVAILABILITY_NOT_SET`, `OUTSIDE_AVAILABILITY`), leave (`COACH_UNAVAILABLE`),
        class sessions (`SESSION_OVERLAP`), appointments (`APPOINTMENT_OVERLAP`, `APPOINTMENT_BUFFER`).
        See `CoachConflict` for the `details.conflicts[]` shape and `GET /api/v1/coaches/eligible` to find a
        free coach first. An audit row (`APPOINTMENT_CREATED`) is written in the same transaction. Booking
        rules for appointments (opening window, limits) are not applied.
      operationId: createAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
            example:
              coachId: 3f0e5f4e-8f3b-4c8a-9d52-1a2b3c4d5e6f
              memberId: 5b1f5b9e-5c1e-4a55-9d7e-2a3b4c5d6e7f
              appointmentTypeId: 7e7e7e7e-0000-4000-8000-000000000009
              startAt: '2026-12-01T06:00:00Z'
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Appointment booked successfully
                      data:
                        $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AppointmentReferenceNotFound'
        '409':
          $ref: '#/components/responses/AppointmentBookingConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Appointments
      summary: Not supported
      description: 'Every method other than GET, POST answers 405 with `Allow: GET, POST`.'
      operationId: methodNotAllowed_api_v1_appointments
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/appointments/{appointmentId}:
    get:
      tags: [Appointments]
      summary: Get an appointment
      description: |
        ADMIN or OWNER: any appointment. COACH: only their own (another coach's appointment is 403).
        MEMBER: only their own (another member's appointment is 403). An unknown id is 404.
      operationId: getAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AppointmentNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
