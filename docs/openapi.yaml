          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          headers:
            Location:
              description: Path of the new session
              schema:
                type: string
                example: /api/v1/sessions/7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ClassNotFound'
        '409':
          $ref: '#/components/responses/ScheduleConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Sessions
      summary: Not supported
      description: 'Every method other than GET, POST answers 405 with `Allow: GET, POST`.'
      operationId: methodNotAllowed_api_v1_sessions
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED
  /api/v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags:
        - Sessions
      summary: Get a session
      description: |
        OWNER, ADMIN, COACH or MEMBER. A session the caller may not see (a private session, or a
        session of a class the caller may not see) is 404 `SESSION_NOT_FOUND`, the same as a session
        that does not exist.
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Sessions
      summary: Update a session
      description: |
        OWNER, ADMIN or COACH. A COACH may change only `capacity`, and only on a session they are
        assigned to (otherwise 403). Past sessions cannot be changed (409 `SESSION_PAST_IMMUTABLE`).
        Send the `version` you read; if the session changed since, the answer is 409
        `SESSION_VERSION_CONFLICT`. Changing coaches or times needs a reason in `overrideReasons`
        (400 when missing).
      operationId: patchSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSessionRequest'
      responses:
        '200':
          description: The updated session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/ScheduleConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Sessions
      summary: Not supported
      description: 'Every method other than GET, PATCH answers 405 with `Allow: GET, PATCH`.'
      operationId: methodNotAllowed_api_v1_sessions__id
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED
  /api/v1/sessions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags:
        - Sessions
      summary: Cancel a session
      description: |
        OWNER, ADMIN or COACH. A COACH may cancel only their own session, and only while it has no
        bookings (otherwise 403). A reason is required. Past sessions are 409 `SESSION_PAST_IMMUTABLE`.
      operationId: cancelSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSessionRequest'
      responses:
        '200':
          description: The session is cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CancelSessionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/ScheduleConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Sessions
      summary: Not supported
      description: 'Every method other than POST answers 405 with `Allow: POST`.'
      operationId: methodNotAllowed_api_v1_sessions__id_cancel
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED
  /api/v1/sessions/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags:
        - Sessions
      summary: Restore a cancelled session
      description: |
        OWNER or ADMIN. Only a cancelled, future session can be restored (409 `SESSION_NOT_CANCELLED`
        or `SESSION_PAST_IMMUTABLE`). Conflicts that appeared since the cancellation (another session
        at the same start, a busy coach) are 409.
      operationId: restoreSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restored (open) session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/ScheduleConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Sessions
      summary: Not supported
      description: 'Every method other than POST answers 405 with `Allow: POST`.'
      operationId: methodNotAllowed_api_v1_sessions__id_restore
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED
  /api-docs/:
    get:
      tags:
        - Docs
      summary: Swagger UI
      description: Interactive API documentation (HTML). Public. Rate limited per IP.
      operationId: apiDocsUi
      responses:
        '200':
          description: Swagger UI page
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api-docs/openapi.yaml:
    get:
      tags:
        - Docs
      summary: This specification as YAML
      description: Public. Rate limited per IP.
      operationId: apiDocsYaml
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api-docs/openapi.json:
    get:
      tags:
        - Docs
      summary: This specification as JSON
      description: Public. Rate limited per IP.
      operationId: apiDocsJson
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/json:
              schema:
                type: object
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/settings/booking-rules:
    get:
      tags: [Settings]
      summary: List the studio booking rules, grouped by category
      description: |
        OWNER or ADMIN. Returns the 8 categories in a fixed order, each with its saved rules.
        Every number carries an explicit `unit` (`hours`, `days`, `count` or `percent`); on/off
        rules have `value: null` and `unit: null`. A deleted rule is not returned and is not
        applied. No paging (21 rules at most).

        Default rules: Booking Window: opens 504 h, closes 1 h, timetable visible 21 days.
        Cancellations: free cancel 12 h, refunded credit expires after 90 days, strikes on,
        3 strikes before suspension, late fee 10 percent (off). Waitlist, guests and capacity:
        waitlist on, 4 per class, auto-book on, overbooking on, 1 guest per member. Booking
        limit: 2 classes per week (off). Appointments: opens 336 h, closes 12 h, free cancel
        12 h. Facilities: free cancel 1 h. Memberships and accounts: client self-pause off,
        credit overdraft off. ClassPass: accept on.
      operationId: listBookingRules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The rules grouped by category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookingRuleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Settings]
      summary: Create a booking rule from the business-defined list
      description: |
        OWNER only (ADMIN gets 403). Creates the row for one of the 21 rule keys, using the
        business default for `value` and `enabled` unless you send them. Use it to bring back a
        rule that was deleted; a rule that already exists is 409 `BOOKING_RULE_ALREADY_EXISTS`.
        Unknown keys, unknown fields (such as `name`, `category` or `unit`) and values that do not
        fit the unit are 400.

        **Check order:** 401/403, 429, 400, 409.
      operationId: createBookingRule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRuleRequest'
      responses:
        '201':
          description: The created rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Booking rule created successfully
                      data:
                        $ref: '#/components/schemas/BookingRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BookingRuleExists'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Settings]
      summary: Not supported
      description: 'Every method other than GET and POST answers 405 with `Allow: GET, POST`.'
      operationId: bookingRulesMethodNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/settings/booking-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/BookingRuleId'
    patch:
      tags: [Settings]
      summary: Change the value or the on/off state of a booking rule
      description: |
        OWNER only (ADMIN gets 403). Send `value` and/or `enabled`; an empty body is 400. The
        name, category, unit and key cannot be changed. Changes apply at once to existing and
        future classes and bookings. Sending what is already stored is a 200 that changes nothing.

        **Check order:** 401/403, 429, 400 (id or body), 404, 400 (value against the unit).
      operationId: updateBookingRule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRuleRequest'
      responses:
        '200':
          description: The rule after the change
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Booking rule updated successfully
                      data:
                        $ref: '#/components/schemas/BookingRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookingRuleNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Settings]
      summary: Delete a booking rule
      description: |
        OWNER only (ADMIN gets 403). The rule is removed: it is no longer returned or applied, and
        there is no fallback default. Create it again with `POST` to bring it back. Returns
        `data: null`.
      operationId: deleteBookingRule
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rule deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Booking rule deleted successfully
                      data:
                        nullable: true
                        example: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookingRuleNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Settings]
      summary: Not supported
      description: 'Every method other than PATCH and DELETE (including GET) answers 405 with `Allow: PATCH, DELETE`.'
      operationId: bookingRuleMethodNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: PATCH, DELETE`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: PATCH, DELETE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login or refresh

  parameters:
    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Plan id (UUID). A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `PLAN_NOT_FOUND`.

    CoachId:
      name: coachId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Coach profile id (not the user id)

    CafeCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cafe category id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `CATEGORY_NOT_FOUND`.

    BookingRuleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Booking rule id (from `GET /settings/booking-rules`). A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `BOOKING_RULE_NOT_FOUND`.

    CafeItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cafe item id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `ITEM_NOT_FOUND`.
    Page:
      name: page
      in: query
      description: Page number, starting at 1
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ClassId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Class id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `CLASS_NOT_FOUND`.
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Slot id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID (or a slot of another class) is 404 `SLOT_NOT_FOUND`.
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `SESSION_NOT_FOUND`.

  headers:
    CafeItemLocation:
      description: Path of the created item
      schema:
        type: string
        example: /api/v1/cafe/items/7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11

  responses:
    ValidationError:
      description: Request failed validation (400). Returns every failing field together. `errors[].field` is the body/query/path field, or `body` for a rule about the request as a whole (for example an empty PATCH).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            code: VALIDATION_ERROR
            errors:
              - field: email
                message: Must be a valid email address

    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication token was not provided
            code: UNAUTHORIZED

    Forbidden:
      description: Authenticated but not allowed for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: You do not have permission to perform this action
            code: FORBIDDEN

    CoachNotFound:
      description: Coach missing or not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Coach not found
            code: COACH_NOT_FOUND

    PlanNotFound:
      description: No plan with this id. (An id that is not a UUID is 400 `VALIDATION_ERROR`, not 404.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Membership plan not found
            code: PLAN_NOT_FOUND

    TooManyRequests:
      description: Rate limit exceeded (1000 requests per 15 minutes by default). Limits are per client IP, and per user and IP on routes behind login. The `RateLimit-*` headers are on every response of a limited route.
      headers:
        Retry-After:
          description: Seconds until the limit resets
          schema:
            type: integer
            example: 540
        RateLimit-Limit:
          description: Requests allowed per window
          schema:
            type: integer
            example: 1000
        RateLimit-Remaining:
          description: Requests left in this window
          schema:
            type: integer
            example: 0
        RateLimit-Reset:
          description: Seconds until the window resets
          schema:
            type: integer
            example: 540
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Too many requests, please try again later
            code: TOO_MANY_REQUESTS

    BookingRuleNotFound:
      description: No booking rule with this id (it may have been deleted)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Booking rule not found
            code: BOOKING_RULE_NOT_FOUND

    BookingRuleExists:
      description: This booking rule already exists (only a deleted rule can be created again)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: This booking rule already exists
            code: BOOKING_RULE_ALREADY_EXISTS

    CafeCategoryNotFound:
      description: No category with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Category not found
            code: CATEGORY_NOT_FOUND

    CafeCategoryExists:
      description: Another category already has this name (case-insensitive)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Category already exists
            code: CATEGORY_EXISTS

    CafeItemNotFound:
      description: No item with this id, or a staff_only item requested by a MEMBER
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Item not found
            code: ITEM_NOT_FOUND

    CafeItemNotTracked:
      description: The item exists but is untracked (`isTracked` false), so it has no stock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Stock can only be updated for tracked items
            code: ITEM_NOT_TRACKED

    CafeOrderInvalidStatusTransition:
      description: |
        The requested status is not the one allowed next step from the order's current status
        (skip, backward, same status, anything after `served`), or another request changed the
        status first. `details.allowed` lists what the order can move to now.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  details:
                    type: object
                    required: [from, to, allowed]
                    properties:
                      from:
                        $ref: '#/components/schemas/CafeOrderStatus'
                      to:
                        $ref: '#/components/schemas/CafeOrderStatus'
                      allowed:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeOrderStatus'
          examples:
            skipStep:
              summary: preparing -> served
              value:
                success: false
                message: Order status cannot change from the current status to the requested one
                code: INVALID_ORDER_STATUS_TRANSITION
                details: { from: preparing, to: served, allowed: [ready] }
            afterServed:
              summary: served -> ready
              value:
                success: false
                message: Order status cannot change from the current status to the requested one
                code: INVALID_ORDER_STATUS_TRANSITION
                details: { from: served, to: ready, allowed: [] }

    CafeOrderNotFound:
      description: No such order, or the order is not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Order not found
            code: ORDER_NOT_FOUND
    ClassInactive:
      description: The class is deactivated or archived, so it cannot be edited (`CLASS_INACTIVE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: A deactivated or archived class cannot be edited
            code: CLASS_INACTIVE
    PayloadTooLarge:
      description: The JSON body is larger than 1 MB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Request body is too large
            code: PAYLOAD_TOO_LARGE
    RouteNotFound:
      description: No route matches this path. The message is fixed and never echoes the URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: The requested route does not exist
            code: ROUTE_NOT_FOUND
    ClassNotFound:
      description: No such class, or the class is not visible to the caller (a hidden class looks exactly like a missing one)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Class not found
            code: CLASS_NOT_FOUND
    SlotNotFound:
      description: No such slot in this class
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Class slot not found
            code: SLOT_NOT_FOUND
    SessionNotFound:
      description: No such session, or the session is not visible to the caller (a hidden session looks exactly like a missing one)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Class session not found
            code: SESSION_NOT_FOUND
    ScheduleConflict:
      description: |
        The change collides with existing data. `code` is one of `SLOT_CONFLICT`, `SESSION_CONFLICT`,
        `COACH_CONFLICT` (coach double-booked, unqualified or on leave), `SESSION_VERSION_CONFLICT`
        (another user changed the session first), `SESSION_NOT_CANCELLED`, `SESSION_PAST_IMMUTABLE`
        or `CLASS_INACTIVE`. `details.conflicts[]` lists what collided where that applies.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  details:
                    type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
          example:
            success: false
            message: A session already exists at this start time for this class
            code: SESSION_CONFLICT
            details:
              conflicts:
                - type: SESSION_CONFLICT
                  sessionId: 7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11
                  startAt: 2030-06-01T10:00:00.000Z
                  endAt: 2030-06-01T11:00:00.000Z
    CafeItemBadRequest:
      description: |
        Validation failed (all failing fields together), a stock rule was broken, or the `categoryId` in the body does not exist.
        `code` is `VALIDATION_ERROR`, `ITEM_TRACKED_STOCK_REQUIRED` (tracked item without `stockQuantity` and `unitCost`, or either set to `null`), `ITEM_SOLD_OUT_ZERO_STOCK` (`available` requested with zero stock) or `CATEGORY_NOT_FOUND` (the `categoryId` in the body does not exist; the category routes, which address the category by path, answer 404 with the same code).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: priceAed
                    message: Price must be greater than 0
            fieldNotEditableHere:
              summary: PATCH /items/{itemId} with availability or visibility
              value:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: availability
                    message: Availability and visibility cannot be updated on this endpoint, use dedicated endpoints
            categoryNotFoundInBody:
              value:
                success: false
                message: Category not found
                code: CATEGORY_NOT_FOUND
            trackedStockRequired:
              value:
                success: false
                message: Tracked items require stockQuantity and unitCost
                code: ITEM_TRACKED_STOCK_REQUIRED
            soldOutZeroStock:
              value:
                success: false
                message: Cannot mark item as available when stock quantity is 0
                code: ITEM_SOLD_OUT_ZERO_STOCK

