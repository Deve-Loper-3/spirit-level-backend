      type: object
      additionalProperties: false
      required: [id, coachId, startDate, endDate, reason, note, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        coachId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          example: '2026-12-01'
          description: First day of leave, YYYY-MM-DD facility calendar date (inclusive)
        endDate:
          type: string
          format: date
          example: '2026-12-05'
          description: Last day of leave, YYYY-MM-DD facility calendar date (inclusive)
        reason:
          type: string
          maxLength: 200
          example: Sick leave
        note:
          type: string
          maxLength: 1000
          nullable: true
          description: Always present; null when there is no note
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AffectedSession:
      type: object
      additionalProperties: false
      required: [sessionId, classId, title, startAt, endAt, coverage]
      properties:
        sessionId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        title:
          type: string
          description: Class name
        startAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        endAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        coverage:
          type: string
          enum: [COVERED, UNCOVERED]
          description: COVERED = at least one OTHER coach assigned to the session is not on leave on that facility day. UNCOVERED = no other coach, or every other coach is on leave.

    CoachUnavailabilityWithImpact:
      description: The leave plus the class sessions it touches. Read-only information; no session is changed.
      allOf:
        - $ref: '#/components/schemas/CoachUnavailability'
        - type: object
          required: [affectedSessions, affectedTotal]
          properties:
            affectedSessions:
              type: array
              maxItems: 100
              description: Upcoming, not-cancelled class sessions inside the leave that this coach is assigned to, in start order. At most 100.
              items:
                $ref: '#/components/schemas/AffectedSession'
            affectedTotal:
              type: integer
              minimum: 0
              description: How many such sessions there are in total (can be larger than the list)

    CreateCoachUnavailabilityRequest:
      type: object
      additionalProperties: false
      required: [startDate, endDate, reason]
      properties:
        startDate:
          type: string
          format: date
