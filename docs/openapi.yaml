      tags: [Cafe]
      summary: List cafe categories
      description: |
        OWNER, ADMIN, COACH or MEMBER. Returns every category (no pagination), ordered by name.

        `itemCount` is the number of items in the category. For a MEMBER it counts **public**
        items only; staff (OWNER, ADMIN, COACH) get the count of all items.
      operationId: listCafeCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Cafe]
      summary: Create a cafe category
      description: |
        OWNER or ADMIN only; a COACH or MEMBER receives 403. The name is trimmed and must be
        unique, case-insensitive (409 `CATEGORY_EXISTS`). A blank `description` is stored as `null`.
      operationId: createCafeCategory
      security:
        - bearerAuth: []
      requestBody:
