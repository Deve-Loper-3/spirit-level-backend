  /api/v1/notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      description: |
        Any signed-in role. Idempotent: reading an already-read notification returns it unchanged (the first
        `readAt` is kept). A notification of another user, or an unknown id, is 404 `NOTIFICATION_NOT_FOUND`
        (never 403). A value that is not a UUID is 400. No request body.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The notification, now read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Notification marked as read
                      data:
                        $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such notification for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Notification not found
                code: NOTIFICATION_NOT_FOUND
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Notifications
      summary: Not supported
      description: 'Every method other than PATCH answers 405 with `Allow: PATCH`.'
      operationId: methodNotAllowed_api_v1_notifications__notificationId_read
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login or refresh

  parameters:
    MembershipId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Membership id (UUID). A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `MEMBERSHIP_NOT_FOUND`.

    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Plan id (UUID). A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `PLAN_NOT_FOUND`.

    CoachId:
      name: coachId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Coach profile id (not the user id)

    UnavailabilityId:
      name: unavailabilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Leave id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID, or a leave of another coach, is 404 `UNAVAILABILITY_NOT_FOUND`.

    AppointmentTypeId:
      name: typeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Appointment type id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `APPOINTMENT_TYPE_NOT_FOUND`.

    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Appointment id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `APPOINTMENT_NOT_FOUND`.

    CafeCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cafe category id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `CATEGORY_NOT_FOUND`.

    BookingRuleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Booking rule id (from `GET /settings/booking-rules`). A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `BOOKING_RULE_NOT_FOUND`.

    CafeItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cafe item id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `ITEM_NOT_FOUND`.
    Page:
      name: page
      in: query
      description: Page number, starting at 1
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ClassId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Class id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `CLASS_NOT_FOUND`.
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Slot id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID (or a slot of another class) is 404 `SLOT_NOT_FOUND`.
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session id. A value that is not a UUID is 400 `VALIDATION_ERROR`; an unknown UUID is 404 `SESSION_NOT_FOUND`.

  headers:
    CafeItemLocation:
      description: Path of the created item
      schema:
        type: string
        example: /api/v1/cafe/items/7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11

  responses:
    ValidationError:
      description: Request failed validation (400). Returns every failing field together. `errors[].field` is the body/query/path field, or `body` for a rule about the request as a whole (for example an empty PATCH).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            code: VALIDATION_ERROR
            errors:
              - field: email
                message: Must be a valid email address

    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication token was not provided
            code: UNAUTHORIZED

    Forbidden:
      description: Authenticated but not allowed for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: You do not have permission to perform this action
            code: FORBIDDEN

    CoachNotFound:
      description: Coach missing or not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Coach not found
            code: COACH_NOT_FOUND

    UnavailabilityNotFound:
      description: Coach missing (`COACH_NOT_FOUND`), or the leave is missing or belongs to another coach (`UNAVAILABILITY_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Coach unavailability not found
            code: UNAVAILABILITY_NOT_FOUND

    UnavailabilityConflict:
      description: |
        `UNAVAILABILITY_OVERLAP` - the dates share a day with another leave of the same coach; the message
        and `details.conflict` name that range. `UNAVAILABILITY_PAST_IMMUTABLE` - the leave has already
        ended and cannot be changed or deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: This coach already has leave from 2026-12-04 to 2026-12-10, which overlaps the requested dates
            code: UNAVAILABILITY_OVERLAP
            details:
              conflict:
                id: 7e7e7e7e-0000-4000-8000-000000000009
                startDate: '2026-12-04'
                endDate: '2026-12-10'

    AppointmentTypeNotFound:
      description: No appointment type with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Appointment type not found
            code: APPOINTMENT_TYPE_NOT_FOUND

    AppointmentTypeConflict:
      description: '`APPOINTMENT_TYPE_NAME_TAKEN` - another ACTIVE type already has this name (ignoring case)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: An active appointment type with this name already exists
            code: APPOINTMENT_TYPE_NAME_TAKEN

    AppointmentNotFound:
      description: No appointment with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Appointment not found
            code: APPOINTMENT_NOT_FOUND

    AppointmentReferenceNotFound:
      description: 'The coach (`COACH_NOT_FOUND`), the member (`MEMBER_NOT_FOUND`) or the appointment type (`APPOINTMENT_TYPE_NOT_FOUND`) named in the body does not exist'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Member not found
            code: MEMBER_NOT_FOUND

    AppointmentBookingConflict:
      description: '`COACH_INACTIVE`, `MEMBER_NOT_ACTIVE` or `APPOINTMENT_TYPE_INACTIVE` - the coach, member or type exists but cannot be booked. `COACH_CONFLICT` - the coach cannot take that time (see `details.conflicts[]`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: The coach is assigned to another class session at that time
            code: COACH_CONFLICT
            details:
              conflicts:
                - type: SESSION_OVERLAP
                  coachId: 3f0e5f4e-8f3b-4c8a-9d52-1a2b3c4d5e6f
                  message: The coach is assigned to another class session at that time
                  conflictingItem:
                    kind: SESSION
                    id: 9a1b2c3d-0000-4000-8000-000000000001
                    startAt: '2026-12-01T06:30:00.000Z'
                    endAt: '2026-12-01T07:30:00.000Z'

    AppointmentCancelConflict:
      description: '`APPOINTMENT_ALREADY_CANCELLED` - already cancelled. `APPOINTMENT_PAST_IMMUTABLE` - the appointment has already started.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: This appointment is already cancelled
            code: APPOINTMENT_ALREADY_CANCELLED

    MembershipNotFound:
      description: No membership with this id. (An id that is not a UUID is 400 `VALIDATION_ERROR`, not 404.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Membership not found
            code: MEMBERSHIP_NOT_FOUND

    PlanNotFound:
      description: No plan with this id. (An id that is not a UUID is 400 `VALIDATION_ERROR`, not 404.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Membership plan not found
            code: PLAN_NOT_FOUND

    TooManyRequests:
      description: Rate limit exceeded (1000 requests per 15 minutes by default). Limits are per client IP, and per user and IP on routes behind login. The `RateLimit-*` headers are on every response of a limited route.
      headers:
        Retry-After:
          description: Seconds until the limit resets
          schema:
            type: integer
            example: 540
        RateLimit-Limit:
          description: Requests allowed per window
          schema:
            type: integer
            example: 1000
        RateLimit-Remaining:
          description: Requests left in this window
          schema:
            type: integer
            example: 0
        RateLimit-Reset:
          description: Seconds until the window resets
          schema:
            type: integer
            example: 540
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Too many requests, please try again later
            code: TOO_MANY_REQUESTS

    BookingRuleNotFound:
      description: No booking rule with this id (it may have been deleted)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Booking rule not found
            code: BOOKING_RULE_NOT_FOUND

    BookingRuleExists:
      description: This booking rule already exists (only a deleted rule can be created again)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: This booking rule already exists
            code: BOOKING_RULE_ALREADY_EXISTS

    CafeCategoryNotFound:
      description: No category with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Category not found
            code: CATEGORY_NOT_FOUND

    CafeCategoryExists:
      description: Another category already has this name (case-insensitive)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Category already exists
            code: CATEGORY_EXISTS

    CafeItemNotFound:
      description: No item with this id, or a staff_only item requested by a MEMBER
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Item not found
            code: ITEM_NOT_FOUND

    CafeItemNotTracked:
      description: The item exists but is untracked (`isTracked` false), so it has no stock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Stock can only be updated for tracked items
            code: ITEM_NOT_TRACKED

    CafeOrderInvalidStatusTransition:
      description: |
        The requested status is not the one allowed next step from the order's current status
        (skip, backward, same status, anything after `served`), or another request changed the
        status first. `details.allowed` lists what the order can move to now.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  details:
                    type: object
                    required: [from, to, allowed]
                    properties:
                      from:
                        $ref: '#/components/schemas/CafeOrderStatus'
                      to:
                        $ref: '#/components/schemas/CafeOrderStatus'
                      allowed:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeOrderStatus'
          examples:
            skipStep:
              summary: preparing -> served
              value:
                success: false
                message: Order status cannot change from the current status to the requested one
                code: INVALID_ORDER_STATUS_TRANSITION
                details: { from: preparing, to: served, allowed: [ready] }
            afterServed:
              summary: served -> ready
              value:
                success: false
                message: Order status cannot change from the current status to the requested one
                code: INVALID_ORDER_STATUS_TRANSITION
                details: { from: served, to: ready, allowed: [] }

    CafeOrderNotFound:
      description: No such order, or the order is not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Order not found
            code: ORDER_NOT_FOUND
    ClassInactive:
      description: The class is deactivated or archived, so it cannot be edited (`CLASS_INACTIVE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: A deactivated or archived class cannot be edited
            code: CLASS_INACTIVE
    PayloadTooLarge:
      description: The JSON body is larger than 1 MB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Request body is too large
            code: PAYLOAD_TOO_LARGE
    RouteNotFound:
      description: No route matches this path. The message is fixed and never echoes the URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: The requested route does not exist
            code: ROUTE_NOT_FOUND
    ClassNotFound:
      description: No such class, or the class is not visible to the caller (a hidden class looks exactly like a missing one)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Class not found
            code: CLASS_NOT_FOUND
    SlotNotFound:
      description: No such slot in this class
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Class slot not found
            code: SLOT_NOT_FOUND
    SessionNotFound:
      description: No such session, or the session is not visible to the caller (a hidden session looks exactly like a missing one)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Class session not found
            code: SESSION_NOT_FOUND
    ScheduleConflict:
      description: |
        The change collides with existing data. `code` is one of `SLOT_CONFLICT`, `SESSION_CONFLICT`,
        `COACH_CONFLICT` (coach double-booked, unqualified, on leave, or, on the manual session create /
        update / restore paths, not available: see `CoachConflict`), `SESSION_VERSION_CONFLICT`
        (another user changed the session first), `SESSION_NOT_CANCELLED`, `SESSION_PAST_IMMUTABLE`
        or `CLASS_INACTIVE`. `details.conflicts[]` lists what collided where that applies.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  details:
                    type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
          example:
            success: false
            message: A session already exists at this start time for this class
            code: SESSION_CONFLICT
            details:
              conflicts:
                - type: SESSION_CONFLICT
                  sessionId: 7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11
                  startAt: 2030-06-01T10:00:00.000Z
                  endAt: 2030-06-01T11:00:00.000Z
    CafeItemBadRequest:
      description: |
        Validation failed (all failing fields together), a stock rule was broken, or the `categoryId` in the body does not exist.
        `code` is `VALIDATION_ERROR`, `ITEM_TRACKED_STOCK_REQUIRED` (tracked item without `stockQuantity` and `unitCost`, or either set to `null`), `ITEM_SOLD_OUT_ZERO_STOCK` (`available` requested with zero stock) or `CATEGORY_NOT_FOUND` (the `categoryId` in the body does not exist; the category routes, which address the category by path, answer 404 with the same code).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: priceAed
                    message: Price must be greater than 0
            fieldNotEditableHere:
              summary: PATCH /items/{itemId} with availability or visibility
              value:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: availability
                    message: Availability and visibility cannot be updated on this endpoint, use dedicated endpoints
            categoryNotFoundInBody:
              value:
                success: false
                message: Category not found
                code: CATEGORY_NOT_FOUND
            trackedStockRequired:
              value:
                success: false
                message: Tracked items require stockQuantity and unitCost
                code: ITEM_TRACKED_STOCK_REQUIRED
            soldOutZeroStock:
              value:
                success: false
                message: Cannot mark item as available when stock quantity is 0
                code: ITEM_SOLD_OUT_ZERO_STOCK

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Present on most write/auth responses; may be omitted on some reads
        data:
          description: Endpoint-specific payload; may be null
        pagination:
          $ref: '#/components/schemas/Pagination'
        counts:
          $ref: '#/components/schemas/PlanSectionCounts'

    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
          description: Machine-readable error code (UPPER_SNAKE_CASE). Present on every error response.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          description: Per-field problems of a 400 `VALIDATION_ERROR`
        details:
          type: object
          additionalProperties: true
          description: Extra structured data for some errors (for example conflicts[] or allowed[])

    Gender:
      type: string
      enum: [MALE, FEMALE, NON_BINARY, PREFER_NOT_TO_SAY]

    Relationship:
      type: string
      enum: [PARENT, SPOUSE, SIBLING, CHILD, FRIEND, GUARDIAN, OTHER]

    Role:
      type: string
      enum: [MEMBER, COACH, ADMIN, OWNER]

    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, DISABLED]

    ImageContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]

    PublicUser:
      type: object
      required:
        - id
        - fullName
        - email
        - phone
        - gender
        - role
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164-style international number
          example: '+12025551234'
        whatsappNumber:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        birthDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        birthMonth:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
        profileImageUrl:
          type: string
          format: uri
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time

    CompletedRegistration:
      type: object
      required: [id, status, registrationCompletedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
        registrationCompletedAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      required:
        - accessToken
        - accessTokenExpiresIn
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
          description: JWT for Authorization Bearer header
        accessTokenExpiresIn:
          type: string
          description: Duration string (e.g. 15m)
          example: 15m
        refreshToken:
          type: string
          description: Opaque refresh token (store securely)
        refreshTokenExpiresAt:
          type: string
          format: date-time

    StaffUser:
      type: object
      required: [id, fullName, email, phone, role, status, emailSent]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        emailSent:
          type: boolean
          description: Whether the invitation email with temp password was sent

    ProfileImageUploadToken:
      type: object
      required:
        - clientToken
        - expiresAt
        - maxSizeBytes
        - allowedContentTypes
        - upload
      properties:
        clientToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        maxSizeBytes:
          type: integer
          example: 4194304
        allowedContentTypes:
          type: array
          items:
            $ref: '#/components/schemas/ImageContentType'
        upload:
          type: object
          required: [method, url, headers]
          properties:
            method:
              type: string
              example: PUT
            url:
              type: string
              format: uri
            headers:
              type: object
              additionalProperties:
                type: string
              description: Headers required for the direct PUT to Vercel Blob

    RegisterRequest:
      type: object
      required: [fullName, email, phone, gender, password]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          description: International phone; spaces/dashes/parens stripped then validated
          example: '+12025551234'
        whatsappNumber:
          type: string
          description: Optional; same phone format as phone
        gender:
          $ref: '#/components/schemas/Gender'
        birthDay:
          type: integer
          minimum: 1
          maximum: 31
          description: Required together with birthMonth when either is set
        birthMonth:
          type: integer
          minimum: 1
          maximum: 12
        profileImageUrl:
          type: string
          format: uri
          description: Optional trusted Vercel Blob URL under profile-images/
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At least one uppercase, one lowercase, and one digit

    CompleteRegistrationRequest:
      type: object
      required: [registrationId, emergencyContact, waiverAccepted]
      properties:
        registrationId:
          type: string
          format: uuid
        emergencyContact:
          type: object
          required: [phone]
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 100
            phone:
              type: string
              description: Must differ from the member phone
            relationship:
              $ref: '#/components/schemas/Relationship'
        waiverAccepted:
          type: boolean
          enum: [true]
          description: Must be literally true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 72

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{4}$'
          description: Exactly 4 digits

    ResetPasswordRequest:
      type: object
      required: [email, resetToken, newPassword]
      properties:
        email:
          type: string
          format: email
        resetToken:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: Same password policy as registration

    ProfileImageTokenRequest:
      type: object
      required: [contentType]
      properties:
        contentType:
          $ref: '#/components/schemas/ImageContentType'

    UpdateProfileImageRequest:
      type: object
      required: [profileImageUrl]
      properties:
        profileImageUrl:
          type: string
          nullable: true
          description: Trusted blob URL, or empty string / null to clear

    CreateStaffRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, role]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [MEMBER, ADMIN, OWNER]
          description: |
            Creation privileges depend on the caller's role.
            Use POST /api/v1/admin/staff/coaches for coaches
            (sending COACH here returns 400 with that guidance).

    CoachType:
      type: string
      enum: [SALARIED, FREELANCE]

    CoachStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 6
        totalPages:
          type: integer
          example: 1

    Coach:
      type: object
      description: Full coach view (managers and the coach themself)
      required:
        - id
        - userId
        - fullName
        - email
        - phone
        - coachType
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        profileImageUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
          maxLength: 1000
        coachType:
          $ref: '#/components/schemas/CoachType'
        status:
          $ref: '#/components/schemas/CoachStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicCoach:
      type: object
      description: Public coach view (no contact or account identifiers)
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        profileImageUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true

    CoachWithEmailSent:
      allOf:
        - $ref: '#/components/schemas/Coach'
        - type: object
          required: [emailSent]
          properties:
            emailSent:
              type: boolean
              description: Whether the invitation email with temp password was sent

    CoachListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Coach'
              - $ref: '#/components/schemas/PublicCoach'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateCoachRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, coachType]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
        coachType:
          $ref: '#/components/schemas/CoachType'
        bio:
          type: string
          maxLength: 1000
        profileImageUrl:
          type: string
          format: uri
          description: Optional trusted Vercel Blob URL under profile-images/
        status:
          $ref: '#/components/schemas/CoachStatus'
          description: Defaults to ACTIVE when omitted

    UpdateCoachRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update; at least one field required.
        ADMIN/OWNER may send any of these fields.
        COACH may only send fullName, phone, profileImageUrl, bio.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          description: Managers only
        phone:
          type: string
        profileImageUrl:
          type: string
          nullable: true
          description: Trusted blob URL, or null to clear
        bio:
          type: string
          nullable: true
          maxLength: 1000
          description: Null clears the bio
        coachType:
          $ref: '#/components/schemas/CoachType'
          description: Managers only

    SetCoachStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CoachStatus'

    AvailabilitySlot:
      type: object
      additionalProperties: false
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '06:00'
          description: 24h HH:mm facility wall-clock time
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '12:00'
          description: 24h HH:mm, later than startTime on the same day

    AvailabilityDay:
      type: object
      additionalProperties: false
      required: [dayOfWeek, isAvailable, slots]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 = Monday ... 7 = Sunday
        isAvailable:
          type: boolean
        slots:
          type: array
          maxItems: 10
          description: Sorted by startTime. Empty when the day is unavailable; at least one range when available.
          items:
            $ref: '#/components/schemas/AvailabilitySlot'

    SaveWeeklyAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [days]
      description: |
        PUT replaces the whole week; days must contain exactly 7 entries (dayOfWeek 1-7, each once).
        Unavailable day = { dayOfWeek, isAvailable: false, slots: [] }.
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/AvailabilityDay'

