  /api/v1/sessions:
    get:
      tags:
        - Sessions
      summary: List sessions in a date range (calendar)
      description: |
        OWNER, ADMIN, COACH or MEMBER. `from` and `to` are required ISO-8601 instants and may be at
        most 92 days apart. Sorted by `startAt`, earliest first.

        A MEMBER sees only sessions of active public classes that are not private. A COACH sees
        those plus every session of the classes they are assigned to.

        **Known limitation:** the role filter runs after the page is cut, so for a MEMBER or COACH a
        page can hold fewer than `limit` items, and `pagination.total` is the number of visible
        sessions on this page, not across all pages. OWNER and ADMIN see every session.

        **Timetable visibility (members only):** while the studio rule `TIMETABLE_VISIBLE_AHEAD` is
        on (default 21 days), a MEMBER sees no session that starts later than that many days from
        now. A range that lies wholly beyond it returns an empty list. COACH, ADMIN and OWNER are
        not capped. If the rule is off or deleted there is no cap.
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: 2030-06-01T00:00:00.000Z
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: 2030-06-08T00:00:00.000Z
        - name: classId
          in: query
          schema:
            type: string
            format: uuid
        - name: coachId
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - full
              - cancelled
        - name: isPrivate
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - pagination
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Sessions
      summary: Create a one-off session
      description: |
        OWNER or ADMIN. Everything not sent is inherited from the class (duration, capacity,
        coaches, intensity, type, description, image). `startAt` must be in the future, and
        `durationMin` must match the interval. Another session of the class at the same `startAt`
        is 409 `SESSION_CONFLICT`.

        **Coach schedule (409 `COACH_CONFLICT`):** the coaches the session ends up with must be free for its
        interval. Besides the older entry (`type: COACH_CONFLICT` for another session of the coach),
        `details.conflicts[]` can carry the entries described by
        `CoachConflict` (`AVAILABILITY_NOT_SET`, `OUTSIDE_AVAILABILITY`, `COACH_UNAVAILABLE`,
        `SESSION_OVERLAP`, `APPOINTMENT_OVERLAP`, `APPOINTMENT_BUFFER`), one per coach that cannot take it.
      operationId: createSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          headers:
            Location:
              description: Path of the new session
              schema:
                type: string
                example: /api/v1/sessions/7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
