        endDate:
          type: string
          format: date
          description: Not before startDate
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Free text; trimmed
        note:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional; blank or null is stored as null

    UpdateCoachUnavailabilityRequest:
