                    properties:
                      message:
                        example: Cafe item availability updated successfully
                      data:
                        $ref: '#/components/schemas/CafeItem'
        '400':
          description: Validation failed, or a tracked item with zero stock cannot be set to `available` (`ITEM_SOLD_OUT_ZERO_STOCK`)
