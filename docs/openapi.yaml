        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassRequest'
      responses:
        '200':
          description: Class updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Class updated successfully
                  data:
                    $ref: '#/components/schemas/ClassResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ClassNotFound'
        '409':
          description: Conflict (duplicate name, version mismatch, inactive class, or `CLASSPASS_NOT_ACCEPTED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Classes
      summary: Not supported
      description: 'Every method other than GET, PATCH answers 405 with `Allow: GET, PATCH`.'
      operationId: methodNotAllowed_api_v1_classes__id
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

