        - reconciliation
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        reconciliation:
          type: object
          description: Result of generating sessions for the rolling window after the slots were created
          required:
            - generatedCount
            - conflictCount
            - windowDays
          properties:
            generatedCount:
              type: integer
              example: 3
            conflictCount:
              type: integer
              example: 0
            windowDays:
              type: integer
              example: 21
    DeletedSlot:
      type: object
      required:
        - id
        - active
        - removedSessionsCount
      properties:
        id:
          type: string
          format: uuid
        active:
          type: boolean
          example: false
        removedSessionsCount:
          type: integer
          description: Future, unbooked, non-overridden generated sessions that were removed
          example: 2
    SessionClassSummary:
      type: object
      nullable: true
      required:
        - id
        - name
        - classType
        - intensity
        - durationMin
        - baseCapacity
        - colour
        - photoUrl
        - timezone
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        classType:
          type: string
          enum:
            - onsite
            - online
        intensity:
          type: integer
          nullable: true
        durationMin:
          type: integer
        baseCapacity:
          type: integer
        colour:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        timezone:
          type: string
          example: Asia/Dubai
    Session:
      type: object
      description: A dated occurrence of a class. Times are ISO-8601 UTC; enums are lowercase.
      required:
        - id
        - classId
        - slotId
        - className
        - class
        - startAt
        - endAt
        - durationMin
        - capacity
        - bookedCount
        - waitlistCount
        - state
        - isPrivate
        - intensity
        - classType
        - facility
        - description
        - image
        - source
        - overriddenFields
        - overrideDetails
        - cancelReason
        - coaches
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
          nullable: true
          description: Null for a one-off session
        className:
          type: string
        class:
          $ref: '#/components/schemas/SessionClassSummary'
        startAt:
          type: string
          format: date-time
          example: 2030-06-01T10:00:00.000Z
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
          example: 60
        capacity:
          type: integer
        bookedCount:
          type: integer
          description: Always 0 until bookings exist
        waitlistCount:
          type: integer
          description: Always 0 until bookings exist
        state:
          type: string
          enum:
            - open
            - full
            - cancelled
        isPrivate:
          type: boolean
        intensity:
          type: integer
          nullable: true
        classType:
          type: string
          enum:
            - onsite
            - online
        facility:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - generated
            - one_off
        overriddenFields:
          type: array
          items:
            type: string
        overrideDetails:
          type: object
          additionalProperties: true
        cancelReason:
          type: string
          nullable: true
        coaches:
          type: array
          items:
            $ref: '#/components/schemas/CoachBrief'
        version:
          type: integer
          description: Send back as `version` on PATCH to detect concurrent edits
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSessionRequest:
      type: object
      required:
        - classId
        - startAt
        - endAt
      properties:
        classId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
          description: ISO-8601; must be in the future
        endAt:
          type: string
          format: date-time
          description: Must be later than `startAt`
        durationMin:
          type: integer
          minimum: 15
          maximum: 240
          description: Must equal the interval between `startAt` and `endAt`; defaults to the class duration
        coachIds:
          type: array
          description: Defaults to the class coaches; no duplicates
          items:
            type: string
            format: uuid
        capacity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 200
        intensity:
          type: integer
          minimum: 1
          maximum: 5
        classType:
          type: string
          enum:
            - onsite
            - online
        facility:
          type: string
          nullable: true
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        image:
          type: string
          nullable: true
          maxLength: 2048
        isPrivate:
          type: boolean
    PatchSessionRequest:
      type: object
      description: |
        At least one field besides `version` and `overrideReasons` is required. Changing `coachIds`,
        `startAt` or `endAt` needs a non-empty reason for that field in `overrideReasons`.
        A COACH may change only `capacity`, and only on their own session.
      properties:
        capacity:
          type: integer
          minimum: 1
          maximum: 200
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
          minimum: 15
          maximum: 240
        coachIds:
          type: array
          items:
            type: string
            format: uuid
        intensity:
          type: integer
          minimum: 1
          maximum: 5
        classType:
          type: string
          enum:
            - onsite
            - online
        facility:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        isPrivate:
          type: boolean
        version:
          type: integer
          minimum: 1
          description: The `version` you last read; a mismatch is 409 `SESSION_VERSION_CONFLICT`
        overrideReasons:
          type: object
          additionalProperties:
            type: string
          example:
            startAt: Moved for the holiday
    CancelSessionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Coach is ill
    CancelSessionResult:
      type: object
      required:
        - id
        - state
        - outcome
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - cancelled
        outcome:
          type: object
          description: What happened to bookings, credits and the waitlist. All null until booking exists.
          required:
            - booking
            - credit
            - waitlist
          properties:
            booking:
              nullable: true
              type: object
              additionalProperties: true
            credit:
              nullable: true
              type: object
              additionalProperties: true
            waitlist:
              nullable: true
              type: object
              additionalProperties: true
