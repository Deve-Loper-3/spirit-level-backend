                code: METHOD_NOT_ALLOWED

  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count my unread notifications
      description: Any signed-in role. Counts only the caller's own unread notifications. Query parameters are not accepted (400).
      operationId: getUnreadNotificationCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The unread count
          content:
            application/json:
