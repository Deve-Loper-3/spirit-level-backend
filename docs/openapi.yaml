    UpdateCafeItemRequest:
      type: object
      minProperties: 1
      description: |
        Partial update. `availability` and `visibility` are rejected here (422); use the
        dedicated endpoints.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
          maxLength: 1000
        nutrition:
          type: object
          additionalProperties: true
          nullable: true
        priceAed:
          type: number
          minimum: 0.01
          maximum: 100000
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: '`https://` URL only; `null` or blank clears the image'
        isTracked:
          type: boolean
        stockQuantity:
          type: integer
          minimum: 0
          maximum: 100000
          nullable: true
        unitCost:
          type: number
          minimum: 0
          maximum: 100000
          nullable: true

    CafeItemAvailabilityRequest:
      type: object
      required: [availability]
      properties:
        availability:
          $ref: '#/components/schemas/CafeItemAvailability'

    CafeItemVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/CafeItemVisibility'

    CafeStockStatus:
      type: string
      description: Derived from quantity (0 OUT_OF_STOCK, 1-14 LOW_STOCK, 15 or more IN_STOCK)
      enum: [OUT_OF_STOCK, LOW_STOCK, IN_STOCK]

    CafeInventoryItem:
      type: object
      required: [id, name, categoryId, quantity, unitCost, stockStatus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        quantity:
          type: integer
          minimum: 0
        unitCost:
          type: number
          nullable: true
          description: AED; `null` when the stored cost is 0 (cost not set)
        stockStatus:
          $ref: '#/components/schemas/CafeStockStatus'

    CafeOrderStatus:
      type: string
      enum: [preparing, ready, served]
    CafeOrderStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CafeOrderStatus'
    CafeOrderListItem:
      type: object
      required:
        [
          id,
          orderNumber,
          status,
          customerName,
          totalAed,
          paymentStatus,
          createdBy,
          itemCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        status:
          $ref: '#/components/schemas/CafeOrderStatus'
        customerName: { type: string, nullable: true }
        totalAed:
          type: number
          description: Placed order total in AED. Not paid revenue.
        paymentStatus:
          type: string
          enum: [not_tracked]
          description: Payments are not tracked; always `not_tracked`.
        createdBy:
          type: object
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
        itemCount: { type: integer, description: Number of line items }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CafeOrderLineItem:
      type: object
      required: [id, itemName, unitPriceAed, quantity, lineTotalAed]
      properties:
        id: { type: string, format: uuid }
        itemName: { type: string, description: Snapshot of the item name when ordered }
        unitPriceAed: { type: number, description: Snapshot of the unit price when ordered }
        quantity: { type: integer, minimum: 1 }
        lineTotalAed: { type: number }
    CafeOrderDetail:
      allOf:
        - $ref: '#/components/schemas/CafeOrderListItem'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CafeOrderLineItem'
    CafeOrderItemSales:
      type: object
      required: [itemName, quantity]
      properties:
        itemName: { type: string }
        quantity: { type: integer }
    CafeOrderSummary:
      type: object
      required: [range, orderCount, preparingCount, topSeller, itemSalesHistory]
      properties:
        range:
          type: object
          required: [from, to, timezone]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timezone: { type: string, example: Asia/Dubai }
        orderCount: { type: integer }
        preparingCount: { type: integer }
        topSeller:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CafeOrderItemSales'
        itemSalesHistory:
          type: array
          items:
            $ref: '#/components/schemas/CafeOrderItemSales'
    CafeInventorySummary:
      type: object
      required:
        [
          trackedItems,
          lowStock,
          outOfStock,
          stockValueAed,
          itemsMissingCost,
          itemsSold,
          revenueFromItemsAed,
          bestSeller,
          salesDataAvailable,
        ]
      properties:
        trackedItems:
          type: integer
          minimum: 0
        lowStock:
          type: integer
          minimum: 0
          description: Tracked items with quantity below 15, including zero
        outOfStock:
          type: integer
          minimum: 0
          description: Tracked items with quantity 0
        stockValueAed:
          type: number
          minimum: 0
          description: Sum of quantity x unitCost (AED, 2 decimals) over items with unitCost > 0
          example: 17.55
        itemsMissingCost:
          type: integer
          minimum: 0
          description: Tracked items whose unitCost is 0
        itemsSold:
          type: integer
          nullable: true
          description: Always null until sales data exists
        revenueFromItemsAed:
          type: number
          nullable: true
          description: Always null until sales data exists
        bestSeller:
          type: object
          nullable: true
          description: Always null until sales data exists
        salesDataAvailable:
          type: boolean
          description: Always false until sales data exists

    UpdateCafeItemStockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          description: New absolute stock quantity (replaces the current value; strings are rejected)

    CafeItemStockUpdate:
      type: object
      required: [id, name, categoryId, quantity, unitCost, stockStatus, availability, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        quantity:
          type: integer
          minimum: 0
        unitCost:
          type: number
          nullable: true
          description: AED; `null` when the stored cost is 0 (cost not set)
        stockStatus:
          $ref: '#/components/schemas/CafeStockStatus'
        availability:
          $ref: '#/components/schemas/CafeItemAvailability'
        updatedAt:
          type: string
          format: date-time
