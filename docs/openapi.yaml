    BookingRule:
      type: object
      required: [id, ruleKey, category, name, value, unit, enabled, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ruleKey:
          type: string
          description: Stable key of the business-defined rule (one row per key).
          enum:
            - BOOKING_WINDOW_OPENS
            - BOOKING_WINDOW_CLOSES
            - TIMETABLE_VISIBLE_AHEAD
            - FREE_CANCEL_BEFORE_CLASS
            - REFUNDED_CREDIT_EXPIRY
            - STRIKES_ENABLED
            - STRIKES_BEFORE_SUSPENSION
            - LATE_FEE
            - WAITLIST_ENABLED
            - WAITLIST_MAX_PER_CLASS
            - WAITLIST_AUTO_BOOK
            - OVERBOOKING_ENABLED
            - MAX_GUESTS_PER_MEMBER
            - MAX_CLASSES_PER_WEEK
            - APPOINTMENT_OPENS
            - APPOINTMENT_CLOSES
            - APPOINTMENT_FREE_CANCEL
            - FACILITY_FREE_CANCEL
            - CLIENT_SELF_PAUSE
            - CREDIT_OVERDRAFT
            - CLASSPASS_ACCEPT
        category:
          $ref: '#/components/schemas/BookingRuleCategory'
        name:
          type: string
        value:
          type: integer
          nullable: true
          description: Whole number in `unit`. `null` for an on/off rule, which has no value.
        unit:
          type: string
          nullable: true
          enum: [hours, days, count, percent]
          description: Unit of `value`. `null` for an on/off rule.
        enabled:
          type: boolean
          description: |
            For a limit rule (windows, cancel hours, expiry, strike threshold, late fee, waitlist
            size, guests, weekly limit, appointments, facilities) off means no restriction. For an
            on/off feature rule (strikes, waitlist, auto-book, overbooking, self-pause, overdraft,
            ClassPass) off means the feature is off.
        updatedAt:
          type: string
          format: date-time
      example:
        id: 3f2b8a4e-6f4e-4c61-9d0f-0c1f7f0a9b11
        ruleKey: BOOKING_WINDOW_OPENS
        category: booking_window
        name: Booking opens before class
        value: 504
        unit: hours
        enabled: true
        updatedAt: '2026-11-10T08:00:00.000Z'

    BookingRuleCategory:
      type: string
      enum:
        - booking_window
        - cancellations
        - waitlist_guests_capacity
        - booking_limit
        - appointments
        - facilities
        - memberships_accounts
        - classpass

