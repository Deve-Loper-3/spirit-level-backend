              quantity: 24
      responses:
        '200':
          description: The item's stock view after the update
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Cafe item stock updated successfully
                      data:
                        $ref: '#/components/schemas/CafeItemStockUpdate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeItemNotFound'
        '409':
          $ref: '#/components/responses/CafeItemNotTracked'
        '429':
