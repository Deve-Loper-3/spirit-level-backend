  /api/v1/cafe/orders/{orderId}/status:
    patch:
      tags: [Cafe]
      summary: Move a cafe order one step forward (preparing -> ready -> served)
      description: |
        SLAPP-79/82 phase 2. **OWNER or ADMIN only**; COACH and MEMBER get 403 (a coach cannot
        change the status even of an order they created). Bearer token only, no cookies; same
        JSON envelope for web and mobile.

        Allowed transitions: `preparing` -> `ready` and `ready` -> `served`, one step at a
        time. Skipping (`preparing` -> `served`), going back, repeating the current status and
        anything after `served` are 409 `INVALID_ORDER_STATUS_TRANSITION` with
        `details: { from, to, allowed }` (`allowed` is the list of statuses the order can move
        to now; empty after `served`). There is no cancel.

        The change is one conditional write (`WHERE id = :orderId AND status = <status read>`),
        so of two concurrent requests for the same step exactly one returns 200 and the other
        409 (its `details.from` is the status the winner set). A `CAFE_ORDER_STATUS_CHANGED`
        audit row (actor id and role, order id and number, from, to) is written in the same
        transaction.

        Only `status` and `updatedAt` change. `paymentStatus` stays `not_tracked`; totals and
        line items are never touched. The body must be exactly `{ "status": ... }`: any other
        key (for example `paymentStatus`, `totalAed`, `items`) is 400, one `errors[]` entry per
        key (`{ field: <key>, message: "Unknown field" }`). Query parameters are not accepted
        (400 `Unknown query parameter`).

        The 200 response has the same `data` shape as `GET /api/v1/cafe/orders/{orderId}`.
      operationId: updateCafeOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CafeOrderStatusUpdateRequest'
            example:
              status: ready
      responses:
        '200':
          description: Status changed; the updated order detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CafeOrderDetail'
              example:
                success: true
                message: Order status updated successfully
                data:
                  id: 6b0f3c52-6f8e-4a51-9b7e-2f1d8c9a4e10
                  orderNumber: CO-000123
                  status: ready
                  customerName: null
                  totalAed: 42
                  paymentStatus: not_tracked
                  createdBy:
                    id: 0c7d1e2f-3a4b-4c5d-8e9f-a0b1c2d3e4f5
                    fullName: Sara Coach
                  itemCount: 2
                  createdAt: '2026-11-06T08:15:00.000Z'
                  updatedAt: '2026-11-06T08:21:43.120Z'
                  items:
                    - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      itemName: Cortado
                      unitPriceAed: 16.5
                      quantity: 2
                      lineTotalAed: 33
                    - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                      itemName: Date Bar
                      unitPriceAed: 9
                      quantity: 1
                      lineTotalAed: 9
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeOrderNotFound'
        '409':
          $ref: '#/components/responses/CafeOrderInvalidStatusTransition'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than PATCH answers 405 with `Allow: PATCH`.'
      operationId: cafeOrderStatusMethodNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

