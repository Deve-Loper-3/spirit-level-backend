  /api/v1/cafe/items:
    get:
      tags: [Cafe]
      summary: List cafe items
      description: |
        OWNER, ADMIN, COACH or MEMBER. Paginated, ordered by name.

        **Members only see `public` items.** Staff see `public` and `staff_only`. Sold-out items
        stay in the list for everyone, so members can see what is temporarily out of stock.

        `search` matches the name or description, case-insensitive, with `%` and `_` treated
        as plain characters.
      operationId: listCafeItems
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Cafe]
      summary: Create a cafe item
      description: |
        OWNER or ADMIN only.

        **Tracked items** (`isTracked: true`, the default) require `stockQuantity` and `unitCost`
        (400 `ITEM_TRACKED_STOCK_REQUIRED`). With `stockQuantity: 0` the item is created
        `sold_out`; asking for `availability: available` with zero stock is 400
        `ITEM_SOLD_OUT_ZERO_STOCK`.

        **Untracked items** (`isTracked: false`, made to order) ignore `stockQuantity` and
        `unitCost`; both are stored as `null`.

        `availability` defaults to `available`, `visibility` to `public`. `imageUrl` must be an
        `https://` URL (use the upload token endpoint for a hosted image) or `null`.

        **Check order:** 401/403, 429, 400 (body), 400 `CATEGORY_NOT_FOUND` (the `categoryId` in
        the body), 400.
      operationId: createCafeItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCafeItemRequest'
            example:
              name: Protein Bar - Caramel
              categoryId: 7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11
              priceAed: 18.5
              isTracked: true
              stockQuantity: 24
              unitCost: 9.25
              visibility: public
      responses:
        '201':
          description: Item created
          headers:
            Location:
              $ref: '#/components/headers/CafeItemLocation'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Cafe item created successfully
                      data:
                        $ref: '#/components/schemas/CafeItem'
        '400':
          $ref: '#/components/responses/CafeItemBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: |
        Every method other than GET and POST (including DELETE) answers 405 with
        `Allow: GET, POST`. Items are never deleted through the API.
      operationId: cafeItemsMethodNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/cafe/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CafeItemId'
    get:
      tags: [Cafe]
      summary: Get one cafe item
      description: |
        OWNER, ADMIN, COACH or MEMBER. A MEMBER asking for a `staff_only` item receives 404
        `ITEM_NOT_FOUND`, the same as for an unknown id.
      operationId: getCafeItem
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CafeItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeItemNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Cafe]
      summary: Update a cafe item's core fields (partial)
      description: |
        OWNER or ADMIN only. Send only the fields to change; an empty body is 400.

        `availability` and `visibility` are **not** editable here: sending either is 400 with
        the message "Availability and visibility cannot be updated on this endpoint, use
        dedicated endpoints" on that field (`ITEM_FIELD_NOT_EDITABLE_HERE`; this is a
        field-level message in `errors[]`, the envelope `code` is `VALIDATION_ERROR`). Use
        `PATCH /api/v1/cafe/items/{itemId}/availability` and `.../visibility`.

        **Stock:** setting a tracked item's `stockQuantity` to 0 sets it to `sold_out`
        automatically. **Restock = `PATCH` the stock here, then `PATCH` the availability to
        `available`.** There is no automatic switch back to `available`.

        Switching `isTracked` from `false` to `true` needs `stockQuantity` and `unitCost` in the
        same request (400 `ITEM_TRACKED_STOCK_REQUIRED`). A tracked item cannot have its stock or
        cost set to `null` (same 400). Switching to `isTracked: false` stores both as `null`.

        **Check order:** 401/403, 429, 400 (id or body), 404 `ITEM_NOT_FOUND`, 400
        `CATEGORY_NOT_FOUND` (the `categoryId` in the body), 400.
      operationId: updateCafeItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCafeItemRequest'
            example:
              stockQuantity: 12
              priceAed: 19
      responses:
        '200':
          description: The item after the update
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Cafe item updated successfully
                      data:
                        $ref: '#/components/schemas/CafeItem'
        '400':
          $ref: '#/components/responses/CafeItemBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeItemNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Cafe]
      summary: Not supported (items are never deleted)
      description: |
        Always answers 405 with `Allow: GET, PATCH`, also without a token. Retire an item with
        `PATCH .../availability` (`sold_out`) or `PATCH .../visibility` (`staff_only`).
      operationId: deleteCafeItemNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/cafe/items/{itemId}/availability:
    parameters:
      - $ref: '#/components/parameters/CafeItemId'
    patch:
      tags: [Cafe]
      summary: Set a cafe item's availability
      description: |
        OWNER or ADMIN only. Setting `available` on a tracked item whose `stockQuantity` is 0
        is 400 `ITEM_SOLD_OUT_ZERO_STOCK`. Untracked items can be set freely. Setting the value
        the item already has returns 200 with the current item.

        Restocking never flips an item back to `available` by itself: PATCH the stock on
        `/api/v1/cafe/items/{itemId}`, then PATCH the availability here.
      operationId: updateCafeItemAvailability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CafeItemAvailabilityRequest'
