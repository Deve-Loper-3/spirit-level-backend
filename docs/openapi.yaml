          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CafeItemCategory'
        description:
          type: string
          nullable: true
        nutrition:
          type: object
          additionalProperties: true
          nullable: true
        priceAed:
          type: number
