      summary: Update a cafe category (partial)
      description: |
        OWNER or ADMIN only. Send `name` and/or `description`; an empty body is 422. Sending
        `description: null` or a blank string clears it.

        **Check order:** 401/403, 429, 422 (id or body), 404, 409.
      operationId: updateCafeCategory
