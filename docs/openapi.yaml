      type: object
      description: At least one field is required
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        startDate:
          type: string
          format: date
        startTime:
          type: string
          example: 09:30
        endTime:
          type: string
          example: 10:30
        capacity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 200
        coachIds:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
