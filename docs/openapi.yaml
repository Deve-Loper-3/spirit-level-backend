          nullable: true
          description: '`null` for untracked items'
        unitCost:
          type: number
          nullable: true
          description: '`null` for untracked items'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCafeItemRequest:
      type: object
      required: [name, categoryId, priceAed]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
          maxLength: 1000
        nutrition:
          type: object
          additionalProperties: true
          nullable: true
        priceAed:
          type: number
          minimum: 0.01
          maximum: 100000
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: '`https://` URL only'
        visibility:
          $ref: '#/components/schemas/CafeItemVisibility'
        isTracked:
          type: boolean
          default: true
        stockQuantity:
          type: integer
          minimum: 0
          maximum: 100000
          nullable: true
          description: Required when `isTracked` is true; ignored (stored as `null`) when false
        unitCost:
          type: number
          minimum: 0
          maximum: 100000
          nullable: true
          description: Required when `isTracked` is true; ignored (stored as `null`) when false
        availability:
          $ref: '#/components/schemas/CafeItemAvailability'

    UpdateCafeItemRequest:
      type: object
      minProperties: 1
      description: |
        Partial update. `availability` and `visibility` are rejected here (400); use the
        dedicated endpoints.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
          maxLength: 1000
        nutrition:
          type: object
          additionalProperties: true
          nullable: true
        priceAed:
          type: number
          minimum: 0.01
          maximum: 100000
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: '`https://` URL only; `null` or blank clears the image'
        isTracked:
          type: boolean
        stockQuantity:
          type: integer
          minimum: 0
          maximum: 100000
          nullable: true
        unitCost:
          type: number
          minimum: 0
          maximum: 100000
          nullable: true

    CafeItemAvailabilityRequest:
      type: object
      required: [availability]
      properties:
        availability:
          $ref: '#/components/schemas/CafeItemAvailability'

    CafeItemVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/CafeItemVisibility'

    CafeStockStatus:
      type: string
      description: Derived from quantity (0 OUT_OF_STOCK, 1-14 LOW_STOCK, 15 or more IN_STOCK)
      enum: [OUT_OF_STOCK, LOW_STOCK, IN_STOCK]

    CafeInventoryItem:
      type: object
      required: [id, name, categoryId, quantity, unitCost, stockStatus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        quantity:
          type: integer
          minimum: 0
        unitCost:
          type: number
          nullable: true
          description: AED; `null` when the stored cost is 0 (cost not set)
        stockStatus:
          $ref: '#/components/schemas/CafeStockStatus'

    CafeOrderStatus:
      type: string
      enum: [preparing, ready, served]
    CafeOrderStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CafeOrderStatus'
    CafeOrderListItem:
      type: object
      required:
        [
          id,
          orderNumber,
          status,
          customerName,
          totalAed,
          paymentStatus,
          createdBy,
          itemCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        status:
          $ref: '#/components/schemas/CafeOrderStatus'
        customerName: { type: string, nullable: true }
        totalAed:
          type: number
          description: Placed order total in AED. Not paid revenue.
        paymentStatus:
          type: string
          enum: [not_tracked]
          description: Payments are not tracked; always `not_tracked`.
        createdBy:
          type: object
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
        itemCount: { type: integer, description: Number of line items }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CafeOrderLineItem:
      type: object
      required: [id, itemName, unitPriceAed, quantity, lineTotalAed]
      properties:
        id: { type: string, format: uuid }
        itemName: { type: string, description: Snapshot of the item name when ordered }
        unitPriceAed: { type: number, description: Snapshot of the unit price when ordered }
        quantity: { type: integer, minimum: 1 }
        lineTotalAed: { type: number }
    CafeOrderDetail:
      allOf:
        - $ref: '#/components/schemas/CafeOrderListItem'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CafeOrderLineItem'
    CafeOrderItemSales:
      type: object
      required: [itemName, quantity]
      properties:
        itemName: { type: string }
        quantity: { type: integer }
    CafeOrderSummary:
      type: object
      required: [range, orderCount, preparingCount, topSeller, itemSalesHistory]
      properties:
        range:
          type: object
          required: [from, to, timezone]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timezone: { type: string, example: Asia/Dubai }
        orderCount: { type: integer }
        preparingCount: { type: integer }
        topSeller:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CafeOrderItemSales'
        itemSalesHistory:
          type: array
          items:
            $ref: '#/components/schemas/CafeOrderItemSales'
    CafeInventorySummary:
      type: object
      required:
        [
          trackedItems,
          lowStock,
          outOfStock,
          stockValueAed,
          itemsMissingCost,
          itemsSold,
          revenueFromItemsAed,
          bestSeller,
          salesDataAvailable,
        ]
      properties:
        trackedItems:
          type: integer
          minimum: 0
        lowStock:
          type: integer
          minimum: 0
          description: Tracked items with quantity below 15, including zero
        outOfStock:
          type: integer
          minimum: 0
          description: Tracked items with quantity 0
        stockValueAed:
          type: number
          minimum: 0
          description: Sum of quantity x unitCost (AED, 2 decimals) over items with unitCost > 0
          example: 17.55
        itemsMissingCost:
          type: integer
          minimum: 0
          description: Tracked items whose unitCost is 0
        itemsSold:
          type: integer
          nullable: true
          description: Always null until sales data exists
        revenueFromItemsAed:
          type: number
          nullable: true
          description: Always null until sales data exists
        bestSeller:
          type: object
          nullable: true
          description: Always null until sales data exists
        salesDataAvailable:
          type: boolean
          description: Always false until sales data exists

    UpdateCafeItemStockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          description: New absolute stock quantity (replaces the current value; strings are rejected)

    CafeItemStockUpdate:
      type: object
      required: [id, name, categoryId, quantity, unitCost, stockStatus, availability, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        quantity:
          type: integer
          minimum: 0
        unitCost:
          type: number
          nullable: true
          description: AED; `null` when the stored cost is 0 (cost not set)
        stockStatus:
          $ref: '#/components/schemas/CafeStockStatus'
        availability:
          $ref: '#/components/schemas/CafeItemAvailability'
        updatedAt:
          type: string
          format: date-time
    PlanSectionCounts:
      type: object
      description: Non-archived plans per section; ignores `q`, all filters and `status`
      required:
        - class_membership
        - online_coaching
      properties:
        class_membership:
          type: integer
          example: 53
        online_coaching:
          type: integer
          example: 7
    CoachBrief:
      type: object
      required:
        - id
        - fullName
        - profileImageUrl
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Sara Khan
        profileImageUrl:
          type: string
          nullable: true
    Membership:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
        - planCount
        - plans
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
          example: Class Memberships
        description:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        planCount:
          type: integer
          example: 3
        plans:
          type: array
          description: The membership's plans (full plan view); empty for a new membership
          items:
            $ref: '#/components/schemas/PlanDetail'
    CreateMembershipRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; unique, ignoring letter case
          example: Class Memberships
        description:
          type: string
          nullable: true
          maxLength: 500
    Slot:
      type: object
      required:
        - id
        - classId
        - dayOfWeek
        - dayName
        - startDate
        - startTime
        - endTime
        - capacity
        - active
        - coaches
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = Monday ... 7 = Sunday
        dayName:
          type: string
          example: Monday
        startDate:
          type: string
          format: date
          description: First date the weekly slot applies (YYYY-MM-DD)
          example: 2030-06-03
        startTime:
          type: string
          description: Facility-local time, HH:mm
          example: 09:00
        endTime:
          type: string
          example: 10:00
        capacity:
          type: integer
          nullable: true
          description: Null means the class base capacity is used
        active:
          type: boolean
        coaches:
          type: array
          items:
            $ref: '#/components/schemas/CoachBrief'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SlotTimeEntry:
      type: object
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 09:00
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than `startTime`
          example: 10:00
        coachIds:
          type: array
          description: No duplicates; each must be an active coach assigned to the class
          items:
            type: string
            format: uuid
          default: []
        capacity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 200
    CreateSlotsRequest:
      type: object
      required:
        - startDate
        - days
      properties:
        startDate:
          type: string
          format: date
          description: A real calendar date, YYYY-MM-DD; not in the past
          example: 2030-06-03
        days:
          type: array
          minItems: 1
          maxItems: 7
          description: One entry per weekday; a weekday may appear only once
          items:
            type: object
            required:
              - dayOfWeek
              - times
            properties:
              dayOfWeek:
                type: integer
                minimum: 1
                maximum: 7
              times:
                type: array
                minItems: 1
                description: Start times must be unique within the day
                items:
                  $ref: '#/components/schemas/SlotTimeEntry'
    UpdateSlotRequest:
      type: object
      description: At least one field is required
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        startDate:
          type: string
          format: date
        startTime:
          type: string
          example: 09:30
        endTime:
          type: string
          example: 10:30
        capacity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 200
        coachIds:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
    CreatedSlots:
      type: object
      required:
        - slots
        - reconciliation
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        reconciliation:
          type: object
          description: Result of generating sessions for the rolling window after the slots were created
          required:
            - generatedCount
            - conflictCount
            - windowDays
          properties:
            generatedCount:
              type: integer
              example: 3
            conflictCount:
              type: integer
              example: 0
            windowDays:
              type: integer
              example: 21
    DeletedSlot:
      type: object
      required:
        - id
        - active
        - removedSessionsCount
      properties:
        id:
          type: string
          format: uuid
        active:
          type: boolean
          example: false
        removedSessionsCount:
          type: integer
          description: Future, unbooked, non-overridden generated sessions that were removed
          example: 2
    SessionClassSummary:
      type: object
      nullable: true
      required:
        - id
        - name
        - classType
        - intensity
        - durationMin
        - baseCapacity
        - colour
        - photoUrl
        - timezone
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        classType:
          type: string
          enum:
            - onsite
            - online
        intensity:
          type: integer
          nullable: true
        durationMin:
          type: integer
        baseCapacity:
          type: integer
        colour:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        timezone:
          type: string
          example: Asia/Dubai
    Session:
      type: object
      description: A dated occurrence of a class. Times are ISO-8601 UTC; enums are lowercase.
      required:
        - id
        - classId
        - slotId
        - className
        - class
        - startAt
        - endAt
        - durationMin
        - capacity
        - bookedCount
        - waitlistCount
        - state
        - isPrivate
        - intensity
        - classType
        - facility
        - description
        - image
        - source
        - overriddenFields
        - overrideDetails
        - cancelReason
        - coaches
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
          nullable: true
          description: Null for a one-off session
        className:
          type: string
        class:
          $ref: '#/components/schemas/SessionClassSummary'
        startAt:
          type: string
          format: date-time
          example: 2030-06-01T10:00:00.000Z
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
          example: 60
        capacity:
          type: integer
        bookedCount:
          type: integer
          description: Number of BOOKED bookings of the session (cancelled bookings do not count)
        waitlistCount:
          type: integer
          description: Always 0. There is no waitlist yet, so nothing can be waiting
        state:
          type: string
          enum:
            - open
            - full
            - cancelled
        isPrivate:
          type: boolean
        intensity:
          type: integer
          nullable: true
        classType:
          type: string
          enum:
            - onsite
            - online
        facility:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - generated
            - one_off
        overriddenFields:
          type: array
          items:
            type: string
        overrideDetails:
          type: object
          additionalProperties: true
        cancelReason:
          type: string
          nullable: true
        coaches:
          type: array
          items:
            $ref: '#/components/schemas/CoachBrief'
        version:
          type: integer
          description: Send back as `version` on PATCH to detect concurrent edits
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSessionRequest:
      type: object
      required:
        - classId
        - startAt
        - endAt
      properties:
        classId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
          description: ISO-8601; must be in the future
        endAt:
          type: string
          format: date-time
          description: Must be later than `startAt`
        durationMin:
          type: integer
          minimum: 15
          maximum: 240
          description: Must equal the interval between `startAt` and `endAt`; defaults to the class duration
        coachIds:
          type: array
          description: Defaults to the class coaches; no duplicates
          items:
            type: string
            format: uuid
        capacity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 200
        intensity:
          type: integer
          minimum: 1
          maximum: 5
        classType:
          type: string
          enum:
            - onsite
            - online
        facility:
          type: string
          nullable: true
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        image:
          type: string
          nullable: true
          maxLength: 2048
        isPrivate:
          type: boolean
    PatchSessionRequest:
      type: object
      description: |
        At least one field besides `version` and `overrideReasons` is required. Changing `coachIds`,
        `startAt` or `endAt` needs a non-empty reason for that field in `overrideReasons`.
        A COACH may change only `capacity`, and only on their own session.
      properties:
        capacity:
          type: integer
          minimum: 1
          maximum: 200
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMin:
          type: integer
          minimum: 15
          maximum: 240
        coachIds:
          type: array
          items:
            type: string
            format: uuid
        intensity:
          type: integer
          minimum: 1
          maximum: 5
        classType:
          type: string
          enum:
            - onsite
            - online
        facility:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        isPrivate:
          type: boolean
        version:
          type: integer
          minimum: 1
          description: The `version` you last read; a mismatch is 409 `SESSION_VERSION_CONFLICT`
        overrideReasons:
          type: object
          additionalProperties:
            type: string
          example:
            startAt: Moved for the holiday
    CancelSessionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Coach is ill
    CancelSessionResult:
      type: object
      required:
        - id
        - state
        - outcome
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - cancelled
        outcome:
          type: object
          description: What happened to bookings, credits and the waitlist. `booking` and `credit` are null when the session had no booked members; `waitlist` is always null for now.
          required:
            - booking
            - credit
            - waitlist
          properties:
            booking:
              nullable: true
              type: object
              additionalProperties: false
              required: [cancelledCount]
              properties:
                cancelledCount:
                  type: integer
                  description: Bookings cancelled by this request
            credit:
              nullable: true
              type: object
              additionalProperties: false
              required: [refundedCount, creditsPerBooking, totalCredits]
              properties:
                refundedCount:
                  type: integer
                  description: Refund rows really inserted (a booking that was already refunded adds none)
                creditsPerBooking:
                  type: integer
                  example: 1
                totalCredits:
                  type: integer
            waitlist:
              nullable: true
              type: object
              additionalProperties: true

