  /api/v1/sessions:
    get:
      tags:
        - Sessions
      summary: List sessions in a date range (calendar)
      description: |
        OWNER, ADMIN, COACH or MEMBER. `from` and `to` are required ISO-8601 instants and may be at
        most 92 days apart. Sorted by `startAt`, earliest first.

        A MEMBER sees only sessions of active public classes that are not private. A COACH sees
        those plus every session of the classes they are assigned to.

        **Known limitation:** the role filter runs after the page is cut, so for a MEMBER or COACH a
        page can hold fewer than `limit` items, and `pagination.total` is the number of visible
        sessions on this page, not across all pages. OWNER and ADMIN see every session.

        **Timetable visibility (members only):** while the studio rule `TIMETABLE_VISIBLE_AHEAD` is
        on (default 21 days), a MEMBER sees no session that starts later than that many days from
        now. A range that lies wholly beyond it returns an empty list. COACH, ADMIN and OWNER are
        not capped. If the rule is off or deleted there is no cap.
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: 2030-06-01T00:00:00.000Z
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: 2030-06-08T00:00:00.000Z
        - name: classId
          in: query
          schema:
            type: string
            format: uuid
        - name: coachId
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - full
              - cancelled
        - name: isPrivate
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - pagination
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
