      description: |
        ADMIN or OWNER only (a COACH or MEMBER is 403). A leave that has not started or is ongoing
        (`endDate` today or later, facility date) can be removed. A leave that has already ended is
        history and is 409 `UNAVAILABILITY_PAST_IMMUTABLE`. A leave id that belongs to another coach is
        404, like an unknown id.

        **No side effects:** no session or appointment changes. An audit row
        (`COACH_UNAVAILABILITY_DELETED`) is written in the same transaction.
      operationId: deleteCoachUnavailability
