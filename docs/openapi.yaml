      tags: [Settings]
      summary: Create a booking rule from the business-defined list
      description: |
        OWNER only (ADMIN gets 403). Creates the row for one of the 21 rule keys, using the
        business default for `value` and `enabled` unless you send them. Use it to bring back a
        rule that was deleted; a rule that already exists is 409 `BOOKING_RULE_ALREADY_EXISTS`.
        Unknown keys, unknown fields (such as `name`, `category` or `unit`) and values that do not
        fit the unit are 400.

        **Check order:** 401/403, 429, 400, 409.
