          description: The item after the update
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Cafe item visibility updated successfully
                      data:
                        $ref: '#/components/schemas/CafeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeItemNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than PATCH answers 405 with `Allow: PATCH`.'
      operationId: cafeItemVisibilityMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedPatchOnly'

  /api/v1/cafe/items/{itemId}/stock:
    parameters:
      - $ref: '#/components/parameters/CafeItemId'
    patch:
      tags: [Cafe]
      summary: Set a tracked cafe item's stock quantity
      description: |
        OWNER or ADMIN only (SLAPP-79/81). Replaces `stockQuantity` with `quantity` (a direct
        overwrite, not an increment). Only tracked items (`isTracked: true`) have stock;
        untracked (made-to-order) items are 409 `ITEM_NOT_TRACKED`.

        Setting `quantity` to 0 also sets `availability` to `sold_out` in the same write.
        Restocking never flips an item back to `available`: PATCH
        `/api/v1/cafe/items/{itemId}/availability` afterwards. `stockStatus` is derived from
        the persisted quantity: 0 `OUT_OF_STOCK`, 1-14 `LOW_STOCK`, 15 or more `IN_STOCK`.
      operationId: updateCafeItemStock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCafeItemStockRequest'
            example:
              quantity: 24
      responses:
        '200':
          description: The item's stock view after the update
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Cafe item stock updated successfully
                      data:
                        $ref: '#/components/schemas/CafeItemStockUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeItemNotFound'
        '409':
          $ref: '#/components/responses/CafeItemNotTracked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than PATCH answers 405 with `Allow: PATCH`.'
      operationId: cafeItemStockMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedPatchOnly'

  /api/v1/cafe/inventory:
    get:
      tags: [Cafe]
      summary: List tracked cafe items with stock status
      description: |
        OWNER or ADMIN only (SLAPP-79/81). Lists tracked items only (`isTracked: true`), both
        `public` and `staff_only`; untracked made-to-order items never appear. Paginated,
        ordered by name ascending.

        `stockStatus` is derived from the quantity: 0 `OUT_OF_STOCK`, 1-14 `LOW_STOCK`,
        15 or more `IN_STOCK`. The `status` filter is applied before pagination, so `total`
        and `totalPages` count only matching items. A stored `unitCost` of 0 is returned as
        `null` here (the catalogue endpoints still return 0).

        `search` matches the name or description, case-insensitive, with `%` and `_` treated
        as plain characters.
      operationId: listCafeInventory
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Uppercase only; lowercase values are 422
          schema:
            $ref: '#/components/schemas/CafeStockStatus'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of tracked items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeInventoryItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`.'
      operationId: cafeInventoryMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedGetOnly'

  /api/v1/cafe/inventory/summary:
    get:
      tags: [Cafe]
      summary: Inventory summary cards
      description: |
        OWNER or ADMIN only (SLAPP-79/81). Aggregates over tracked items only
        (`isTracked: true`, `public` and `staff_only`); untracked made-to-order items are not
        counted. Takes no query parameters.

        `lowStock` counts quantity below 15 **including** zero; `outOfStock` counts quantity 0.
        `stockValueAed` is the sum of quantity x unitCost over items with a positive unitCost,
        summed in integer fils and returned as AED with 2 decimals. Items with unitCost 0 add
        nothing to the value and are counted in `itemsMissingCost`.

        There is no sales data yet: `itemsSold`, `revenueFromItemsAed` and `bestSeller` are
        always `null` and `salesDataAvailable` is `false`.
      operationId: getCafeInventorySummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The summary cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CafeInventorySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`.'
      operationId: cafeInventorySummaryMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedGetOnly'

  /api/v1/cafe/orders:
    get:
      tags: [Cafe]
      summary: List cafe orders (order queue)
      description: |
        SLAPP-79/82. OWNER or ADMIN see every order. COACH sees **only orders they created**
        (`createdBy` = the authenticated user, taken from the token, never from the request).
        MEMBER gets 403. Orders are created by a later ticket (no create endpoint); OWNER /
        ADMIN change the status with `PATCH /api/v1/cafe/orders/{orderId}/status`.

        `from` / `to` are calendar dates in the facility time zone (Asia/Dubai), both inclusive.
        `search` matches order number, customer name or any line item name (case-insensitive,
        `%` and `_` are literal). Sorted newest first.

        **Strict query parameters.** Allowed: `from`, `to`, `status`, `search`, `page`, `limit`.
        Any other query parameter (for example `source`, `userId`, `createdBy`, `sort`) is
        rejected with 422 `VALIDATION_ERROR`, one `errors[]` entry per unknown key
        (`{ field: <key>, message: "Unknown query parameter" }`). There is no source filter, and
        no parameter can change whose orders are returned. A repeated parameter
        (`?status=a&status=b`) is also 422. Unlike the older cafe catalogue and inventory
        endpoints, which ignore unknown keys.

        `paymentStatus` is always `not_tracked`: payments are not recorded and an order is never
        marked paid. `totalAed` is the placed order total, not paid revenue.
      operationId: listCafeOrders
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: to
          in: query
          description: Must be on or after `from`
          schema: { type: string, format: date, example: '2026-11-06' }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CafeOrderStatus'
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of orders visible to the caller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeOrderListItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`. Order creation is not available yet.'
      operationId: cafeOrdersMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedGetOnly'

  /api/v1/cafe/orders/summary:
    get:
      tags: [Cafe]
      summary: Cafe order summary cards
      description: |
        SLAPP-79/82. Same visibility rule as the list: OWNER / ADMIN aggregate every order,
        COACH only their own, MEMBER 403.

        `from` / `to` are facility-local dates (inclusive). With neither, the range is today;
        with only one, the other defaults to today (or to the same day if that would invert
        the range). `orderCount` counts orders placed in range; `preparingCount` counts only
        `preparing` orders; `itemSalesHistory` is the quantity sold per item name (from the
        order line snapshots), highest first with ties alphabetical; `topSeller` is its first
        row or `null`. There is deliberately no revenue figure.

        **Strict query parameters.** Allowed: `from`, `to` only. Any other query parameter
        (including the list's `status`, `search`, `page`, `limit`, and `source` / `userId`) is
        rejected with 422 `VALIDATION_ERROR`, one `errors[]` entry per unknown key
        (`{ field: <key>, message: "Unknown query parameter" }`).
      operationId: getCafeOrderSummary
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The summary for the range
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CafeOrderSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`.'
      operationId: cafeOrderSummaryMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedGetOnly'

  /api/v1/cafe/orders/{orderId}:
    get:
      tags: [Cafe]
      summary: Get one cafe order with its line items
      description: |
        SLAPP-79/82. OWNER / ADMIN can read any order; COACH only orders they created. An order
        outside the caller's scope returns the same 404 `ORDER_NOT_FOUND` as a missing one.
        Line items are snapshots taken when the order was placed: later catalogue renames,
        price changes or deletions never change them.

        **Strict query parameters.** Allowed: none. Any query parameter (for example `userId`
        or `include`) is rejected with 422 `VALIDATION_ERROR`, one `errors[]` entry per unknown
        key (`{ field: <key>, message: "Unknown query parameter" }`). A non-UUID `orderId` is
        also 422 (`field: orderId`). Validation runs before the lookup, so a 422 never reveals
        whether the order exists.
      operationId: getCafeOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CafeOrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeOrderNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`.'
      operationId: cafeOrderMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedGetOnly'

  /api/v1/cafe/orders/{orderId}/status:
    patch:
      tags: [Cafe]
      summary: Move a cafe order one step forward (preparing -> ready -> served)
      description: |
        SLAPP-79/82 phase 2. **OWNER or ADMIN only**; COACH and MEMBER get 403 (a coach cannot
        change the status even of an order they created). Bearer token only, no cookies; same
        JSON envelope for web and mobile.

        Allowed transitions: `preparing` -> `ready` and `ready` -> `served`, one step at a
        time. Skipping (`preparing` -> `served`), going back, repeating the current status and
        anything after `served` are 409 `INVALID_ORDER_STATUS_TRANSITION` with
        `details: { from, to, allowed }` (`allowed` is the list of statuses the order can move
        to now; empty after `served`). There is no cancel.

        The change is one conditional write (`WHERE id = :orderId AND status = <status read>`),
        so of two concurrent requests for the same step exactly one returns 200 and the other
        409 (its `details.from` is the status the winner set). A `CAFE_ORDER_STATUS_CHANGED`
        audit row (actor id and role, order id and number, from, to) is written in the same
        transaction.

        Only `status` and `updatedAt` change. `paymentStatus` stays `not_tracked`; totals and
        line items are never touched. The body must be exactly `{ "status": ... }`: any other
        key (for example `paymentStatus`, `totalAed`, `items`) is 422, one `errors[]` entry per
        key (`{ field: <key>, message: "Unknown field" }`). Query parameters are not accepted
        (422 `Unknown query parameter`).

        The 200 response has the same `data` shape as `GET /api/v1/cafe/orders/{orderId}`.
      operationId: updateCafeOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CafeOrderStatusUpdateRequest'
            example:
              status: ready
      responses:
        '200':
          description: Status changed; the updated order detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CafeOrderDetail'
              example:
                success: true
                message: Order status updated successfully
                data:
                  id: 6b0f3c52-6f8e-4a51-9b7e-2f1d8c9a4e10
                  orderNumber: CO-000123
                  status: ready
                  customerName: null
                  totalAed: 42
                  paymentStatus: not_tracked
                  createdBy:
                    id: 0c7d1e2f-3a4b-4c5d-8e9f-a0b1c2d3e4f5
                    fullName: Sara Coach
                  itemCount: 2
                  createdAt: '2026-11-06T08:15:00.000Z'
                  updatedAt: '2026-11-06T08:21:43.120Z'
                  items:
                    - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      itemName: Cortado
                      unitPriceAed: 16.5
                      quantity: 2
                      lineTotalAed: 33
                    - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                      itemName: Date Bar
                      unitPriceAed: 9
                      quantity: 1
                      lineTotalAed: 9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CafeOrderNotFound'
        '409':
          $ref: '#/components/responses/CafeOrderInvalidStatusTransition'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than PATCH answers 405 with `Allow: PATCH`.'
      operationId: cafeOrderStatusMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedPatchOnly'

  /api/v1/cafe/uploads/image/token:
    post:
      tags: [Cafe]
      summary: Issue a client upload token for a cafe item image
      description: |
        OWNER or ADMIN only. Same request and response format as
        `POST /api/v1/uploads/profile-image/token`, but the blob is stored under the
        `cafe-items/` folder. Max size 4 MB; allowed types `image/jpeg`, `image/png`,
        `image/webp`. PUT the bytes to `data.upload.url`, then send the resulting `https://`
        URL as `imageUrl` when creating or updating an item.
      operationId: issueCafeImageToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileImageTokenRequest'
            example:
              contentType: image/jpeg
      responses:
        '200':
          description: Upload token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Image upload token issued successfully
                      data:
                        $ref: '#/components/schemas/ProfileImageUploadToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Failed to prepare upload with storage provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Blob storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than POST answers 405 with `Allow: POST`.'
      operationId: cafeImageTokenMethodNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/CafeMethodNotAllowedPostOnly'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login or refresh

  parameters:
    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Plan id (UUID). An unknown or malformed id returns 404.

    CoachId:
      name: coachId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Coach profile id (not the user id)

    CafeCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cafe category id. A value that is not a UUID is 422 `VALIDATION_ERROR`; an unknown UUID is 404 `CATEGORY_NOT_FOUND`.

    CafeItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cafe item id. A value that is not a UUID is 422 `VALIDATION_ERROR`; an unknown UUID is 404 `ITEM_NOT_FOUND`.

  headers:
    CafeCategoryLocation:
      description: Path of the created category
      schema:
        type: string
        example: /api/v1/cafe/categories/7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11

    CafeItemLocation:
      description: Path of the created item
      schema:
        type: string
        example: /api/v1/cafe/items/7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11

  responses:
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            errors:
              - field: email
                message: Must be a valid email address

    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication token was not provided

    Forbidden:
      description: Authenticated but not allowed for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: You do not have permission to perform this action

    CoachNotFound:
      description: Coach missing or not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Coach not found

    PlanNotFound:
      description: No plan with this id (an id that is not a UUID is also a 404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Membership plan not found
            code: PLAN_NOT_FOUND

    MethodNotAllowed:
      description: The route exists but not for this method
      headers:
        Allow:
          description: Methods the route supports
          schema:
            type: string
            example: GET, PATCH
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Method not allowed for this route
            code: METHOD_NOT_ALLOWED

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Too many requests, please try again later

    ValidationFailed:
      description: Validation failed (returns all failing fields together)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            code: VALIDATION_ERROR
            errors:
              - field: name
                message: Category name is required

    CafeCategoryNotFound:
      description: No category with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Category not found
            code: CATEGORY_NOT_FOUND

    CafeCategoryExists:
      description: Another category already has this name (case-insensitive)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Category already exists
            code: CATEGORY_EXISTS

    CafeItemNotFound:
      description: No item with this id, or a staff_only item requested by a MEMBER
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Item not found
            code: ITEM_NOT_FOUND

    CafeItemNotTracked:
      description: The item exists but is untracked (`isTracked` false), so it has no stock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Stock can only be updated for tracked items
            code: ITEM_NOT_TRACKED

    CafeStockRuleViolation:
      description: |
        A stock rule was broken: `ITEM_TRACKED_STOCK_REQUIRED` (tracked item without
        `stockQuantity` and `unitCost`, or either set to `null`) or
        `ITEM_SOLD_OUT_ZERO_STOCK` (`available` requested with zero stock, create only)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            trackedStockRequired:
              value:
                success: false
                message: Tracked items require stockQuantity and unitCost
                code: ITEM_TRACKED_STOCK_REQUIRED
            soldOutZeroStock:
              value:
                success: false
                message: Cannot mark item as available when stock quantity is 0
                code: ITEM_SOLD_OUT_ZERO_STOCK

    CafeItemValidationFailed:
      description: |
        Validation failed (all failing fields together), or the `categoryId` in the body does
        not exist. The latter is 422 with code `CATEGORY_NOT_FOUND` (the same code as the 404
        on the category routes, which address the category by path).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: priceAed
                    message: Price must be greater than 0
            fieldNotEditableHere:
              summary: PATCH /items/{itemId} with availability or visibility
              value:
                success: false
                message: Validation failed
                code: VALIDATION_ERROR
                errors:
                  - field: availability
                    message: Availability and visibility cannot be updated on this endpoint, use dedicated endpoints
            categoryNotFoundInBody:
              value:
                success: false
                message: Category not found
                code: CATEGORY_NOT_FOUND

    CafeMethodNotAllowedCollection:
      description: 'Route exists but not for this method (`Allow: GET, POST`)'
      headers:
        Allow:
          description: Methods the route supports
          schema:
            type: string
            example: GET, POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Method not allowed for this route
            code: METHOD_NOT_ALLOWED

    CafeMethodNotAllowedCategory:
      description: 'Route exists but not for this method (`Allow: PATCH, DELETE`)'
      headers:
        Allow:
          description: Methods the route supports
          schema:
            type: string
            example: PATCH, DELETE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Method not allowed for this route
            code: METHOD_NOT_ALLOWED

    CafeMethodNotAllowedItem:
      description: 'Route exists but not for this method (`Allow: GET, PATCH`)'
      headers:
        Allow:
          description: Methods the route supports
          schema:
            type: string
            example: GET, PATCH
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Method not allowed for this route
            code: METHOD_NOT_ALLOWED

    CafeMethodNotAllowedPatchOnly:
      description: 'Route exists but not for this method (`Allow: PATCH`)'
      headers:
        Allow:
          description: Methods the route supports
          schema:
            type: string
            example: PATCH
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Method not allowed for this route
            code: METHOD_NOT_ALLOWED

    CafeMethodNotAllowedPostOnly:
      description: 'Route exists but not for this method (`Allow: POST`)'
      headers:
        Allow:
          description: Methods the route supports
          schema:
            type: string
            example: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Method not allowed for this route
            code: METHOD_NOT_ALLOWED

    CafeOrderInvalidStatusTransition:
      description: |
        The requested status is not the one allowed next step from the order's current status
        (skip, backward, same status, anything after `served`), or another request changed the
        status first. `details.allowed` lists what the order can move to now.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  details:
                    type: object
                    required: [from, to, allowed]
                    properties:
                      from:
                        $ref: '#/components/schemas/CafeOrderStatus'
                      to:
                        $ref: '#/components/schemas/CafeOrderStatus'
                      allowed:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeOrderStatus'
          examples:
            skipStep:
              summary: preparing -> served
              value:
                success: false
                message: Order status cannot change from the current status to the requested one
                code: INVALID_ORDER_STATUS_TRANSITION
                details: { from: preparing, to: served, allowed: [ready] }
            afterServed:
              summary: served -> ready
              value:
                success: false
                message: Order status cannot change from the current status to the requested one
                code: INVALID_ORDER_STATUS_TRANSITION
                details: { from: served, to: ready, allowed: [] }

    CafeOrderNotFound:
      description: No such order, or the order is not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Order not found
            code: ORDER_NOT_FOUND

    CafeMethodNotAllowedGetOnly:
      description: 'Route exists but not for this method (`Allow: GET`)'
      headers:
        Allow:
          description: Methods the route supports
          schema:
            type: string
            example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Method not allowed for this route
            code: METHOD_NOT_ALLOWED

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Present on most write/auth responses; may be omitted on some reads
        data:
          description: Endpoint-specific payload; may be null
        pagination:
          $ref: '#/components/schemas/Pagination'

    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
          description: Machine-readable error code when provided
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Gender:
      type: string
      enum: [MALE, FEMALE, NON_BINARY, PREFER_NOT_TO_SAY]

    Relationship:
      type: string
      enum: [PARENT, SPOUSE, SIBLING, CHILD, FRIEND, GUARDIAN, OTHER]

    Role:
      type: string
      enum: [MEMBER, COACH, ADMIN, OWNER]

    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, DISABLED]

    ImageContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]

    PublicUser:
      type: object
      required:
        - id
        - fullName
        - email
        - phone
        - gender
        - role
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164-style international number
          example: '+12025551234'
        whatsappNumber:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        birthDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        birthMonth:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
        profileImageUrl:
          type: string
          format: uri
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time

    CompletedRegistration:
      type: object
      required: [id, status, registrationCompletedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
        registrationCompletedAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      required:
        - accessToken
        - accessTokenExpiresIn
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
          description: JWT for Authorization Bearer header
        accessTokenExpiresIn:
          type: string
          description: Duration string (e.g. 15m)
          example: 15m
        refreshToken:
          type: string
          description: Opaque refresh token (store securely)
        refreshTokenExpiresAt:
          type: string
          format: date-time

    StaffUser:
      type: object
      required: [id, fullName, email, phone, role, status, emailSent]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
