                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CafeInventoryItem'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Cafe]
      summary: Not supported
      description: 'Every method other than GET answers 405 with `Allow: GET`.'
      operationId: cafeInventoryMethodNotAllowed
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
