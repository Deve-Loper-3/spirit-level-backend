      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all my notifications as read
      description: Any signed-in role. Marks the caller's own unread notifications as read and returns how many changed (0 when none). No request body.
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications marked as read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
