      summary: Create a one-off session
      description: |
        OWNER or ADMIN. Everything not sent is inherited from the class (duration, capacity,
        coaches, intensity, type, description, image). `startAt` must be in the future, and
        `durationMin` must match the interval. Another session of the class at the same `startAt`
        is 409 `SESSION_CONFLICT`.
      operationId: createSession
