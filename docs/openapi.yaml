          example: 2030-06-03
        days:
          type: array
          minItems: 1
          maxItems: 7
          description: One entry per weekday; a weekday may appear only once
          items:
            type: object
            required:
              - dayOfWeek
              - times
            properties:
              dayOfWeek:
                type: integer
                minimum: 1
                maximum: 7
              times:
                type: array
                minItems: 1
                description: Start times must be unique within the day
                items:
                  $ref: '#/components/schemas/SlotTimeEntry'
