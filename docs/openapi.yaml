          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 09:00
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than `startTime`
          example: 10:00
        coachIds:
          type: array
          description: No duplicates; each must be an active coach assigned to the class
          items:
            type: string
            format: uuid
          default: []
