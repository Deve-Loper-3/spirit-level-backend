  /api/v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags:
        - Sessions
      summary: Get a session
      description: |
        OWNER, ADMIN, COACH or MEMBER. A session the caller may not see (a private session, or a
        session of a class the caller may not see) is 404 `SESSION_NOT_FOUND`, the same as a session
        that does not exist.
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Sessions
      summary: Update a session
      description: |
        OWNER, ADMIN or COACH. A COACH may change only `capacity`, and only on a session they are
        assigned to (otherwise 403). Past sessions cannot be changed (409 `SESSION_PAST_IMMUTABLE`).
        Send the `version` you read; if the session changed since, the answer is 409
        `SESSION_VERSION_CONFLICT`. Changing coaches or times needs a reason in `overrideReasons`
        (400 when missing).

        **Replacing a coach:** send the FINAL `coachIds` of this one session (plus `overrideReasons.coachIds`).
        It changes only this session, never the class template or the other occurrences, and writes the audit
        entry `SESSION_COACH_REPLACED` (previous and new coach ids). The replacement is manual; nothing is
        chosen automatically. Any ACTIVE coach may be chosen, including one who is not assigned to the class
        (the ones `GET /api/v1/coaches/eligible` lists); an unknown or inactive coach is 400. Choosing a coach
        does not add them to the class template and changes no other occurrence. The final coach set is checked
        for the session interval and every coach must be free (`CoachConflict`); a coach the picker marks
        ineligible gets 409 `COACH_CONFLICT` with the same reason. A PATCH that does not change the coach set or the
        time (other fields, or the same coaches sent again) is not checked against availability, leave or
        appointments, so unrelated edits keep working. Changing the time checks the existing coaches against
        the new time.

        **Coach schedule (409 `COACH_CONFLICT`):** the coaches the session ends up with must be free for its
        interval. Besides the older entry (`type: COACH_CONFLICT` for another session of the coach),
        `details.conflicts[]` can carry the entries described by
        `CoachConflict` (`AVAILABILITY_NOT_SET`, `OUTSIDE_AVAILABILITY`, `COACH_UNAVAILABLE`,
        `SESSION_OVERLAP`, `APPOINTMENT_OVERLAP`, `APPOINTMENT_BUFFER`), one per coach that cannot take it.
      operationId: patchSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSessionRequest'
      responses:
        '200':
          description: The updated session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/ScheduleConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Sessions
      summary: Not supported
      description: 'Every method other than GET, PATCH answers 405 with `Allow: GET, PATCH`.'
      operationId: methodNotAllowed_api_v1_sessions__id
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, PATCH`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, PATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED
  /api/v1/sessions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags:
        - Sessions
      summary: Cancel a session
      description: |
        OWNER, ADMIN or COACH. A COACH may cancel only their own session, and only while it has no
        bookings (otherwise 403). A reason is required. Past sessions are 409 `SESSION_PAST_IMMUTABLE`.

        **Bookings (class cancellation only):** in the same transaction every BOOKED booking of the session
        becomes CANCELLED (with `cancelledAt`) and the member gets one credit back: one ledger row of +1
        (`CLASS_CANCELLED_REFUND`) per booking. A booking is refunded only once, so cancelling again (or
        restoring and cancelling again) never refunds twice; `outcome.credit.refundedCount` counts the rows
        really inserted. After the commit each booked member gets an in-app notification (`CLASS_CANCELLED`,
        see `GET /api/v1/notifications`) and an e-mail. A failure of the notification or the e-mail is logged
        and never fails or undoes the cancellation. A session without bookings answers as before
        (`outcome` parts are `null`). Restoring a session does not re-book members or reverse credits. A coach
        replacement, a coach's leave or availability never create notifications or e-mails.
      operationId: cancelSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSessionRequest'
      responses:
        '200':
          description: The session is cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CancelSessionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/ScheduleConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Sessions
      summary: Not supported
      description: 'Every method other than POST answers 405 with `Allow: POST`.'
      operationId: methodNotAllowed_api_v1_sessions__id_cancel
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED
  /api/v1/sessions/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags:
        - Sessions
      summary: Restore a cancelled session
      description: |
        OWNER or ADMIN. Only a cancelled, future session can be restored (409 `SESSION_NOT_CANCELLED`
        or `SESSION_PAST_IMMUTABLE`). Conflicts that appeared since the cancellation (another session
        at the same start, a busy coach) are 409. The session's coaches must be free again for its interval
        (availability, leave, appointments): 409 `COACH_CONFLICT` with the entries of `CoachConflict`, and the
        session stays cancelled.
      operationId: restoreSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restored (open) session
          content:
            application/json:
              schema:
                allOf:
