          format: uuid
        coachId:
          type: string
          format: uuid
        coachName:
          type: string
          nullable: true
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
          nullable: true
        appointmentTypeId:
          type: string
          format: uuid
        appointmentTypeName:
          type: string
          nullable: true
          description: The type's current name (the type can be renamed later)
        startAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        endAt:
          type: string
          format: date-time
          description: ISO 8601 UTC; `startAt` plus the type's duration at booking time
        bufferBeforeMin:
          type: integer
          description: Snapshot copied from the type when the appointment was booked
        bufferAfterMin:
          type: integer
          description: Snapshot copied from the type when the appointment was booked
        state:
          $ref: '#/components/schemas/AppointmentState'
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: Always present; null unless the appointment is cancelled
        version:
          type: integer
          description: Starts at 1 and goes up by one on every change
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required: [coachId, memberId, appointmentTypeId, startAt]
      properties:
        coachId:
          type: string
          format: uuid
          description: Coach profile id (not the user id)
        memberId:
          type: string
          format: uuid
          description: User id of an active MEMBER
        appointmentTypeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
          description: ISO 8601 with `Z` or a UTC offset; must be in the future

    CoachConflictType:
      type: string
      description: |
        Why a coach cannot take an interval (first failing rule wins, in this order).
        `AVAILABILITY_NOT_SET` - no hours saved for that weekday. `OUTSIDE_AVAILABILITY` - the interval does
        not fit fully inside ONE saved slot of that facility day (touching slots count as one), the day is a
        saved day off, or the interval crosses midnight. `COACH_UNAVAILABLE` - leave on any day the interval
        touches. `SESSION_OVERLAP` - another not-cancelled class session of the coach overlaps (touching is
        fine). `APPOINTMENT_OVERLAP` - a BOOKED appointment overlaps. `APPOINTMENT_BUFFER` - times do not
        overlap but the buffers (before / after, of both sides) do.
      enum:
        - AVAILABILITY_NOT_SET
        - OUTSIDE_AVAILABILITY
        - COACH_UNAVAILABLE
        - SESSION_OVERLAP
        - APPOINTMENT_OVERLAP
        - APPOINTMENT_BUFFER

    CoachConflictItem:
      type: object
      additionalProperties: false
      required: [kind, id, startAt, endAt]
      description: The thing in the way. For `LEAVE`, `startAt` / `endAt` are the UTC bounds of the leave's facility days (`endAt` is the start of the day after the last leave day).
      properties:
        kind:
          type: string
          enum: [SESSION, APPOINTMENT, LEAVE]
        id:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time

    CoachConflict:
      type: object
      additionalProperties: false
      required: [type, coachId, message, conflictingItem]
      description: One entry of `details.conflicts[]` of a 409 `COACH_CONFLICT` raised by the coach schedule check. (Older class-session conflicts keep their own entry shape.)
      properties:
        type:
          $ref: '#/components/schemas/CoachConflictType'
        coachId:
          type: string
          format: uuid
        message:
          type: string
        conflictingItem:
          allOf:
            - $ref: '#/components/schemas/CoachConflictItem'
          nullable: true
          description: Always present; null for availability conflicts

    EligibleCoach:
      type: object
      additionalProperties: false
      required: [coachId, fullName, eligible, conflict]
      properties:
        coachId:
          type: string
          format: uuid
          description: Coach profile id (not the user id)
        fullName:
          type: string
        eligible:
          type: boolean
        conflict:
          type: object
          nullable: true
          additionalProperties: false
          required: [type, message, conflictingItem]
          description: Always present; null when `eligible` is true
          properties:
            type:
              $ref: '#/components/schemas/CoachConflictType'
            message:
              type: string
            conflictingItem:
              allOf:
                - $ref: '#/components/schemas/CoachConflictItem'
              nullable: true

    OpenSlot:
      type: object
      additionalProperties: false
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          example: '2026-12-01T05:00:00.000Z'
        endAt:
          type: string
          format: date-time
          description: "`startAt` plus the type's duration"
          example: '2026-12-01T06:00:00.000Z'

    CoachOpenSlots:
      type: object
      additionalProperties: false
      required: [coachId, appointmentTypeId, timezone, from, to, availabilityConfigured, days]
      properties:
        coachId:
          type: string
          format: uuid
        appointmentTypeId:
          type: string
          format: uuid
        timezone:
          type: string
          example: Asia/Dubai
          description: Facility timezone of `date`
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        availabilityConfigured:
          type: boolean
          description: false when the coach has never saved weekly hours (show "hours not set")
        days:
          type: array
          description: One entry per facility day from `from` to `to`, in order
          items:
            type: object
            additionalProperties: false
            required: [date, slots]
            properties:
              date:
                type: string
                format: date
              slots:
                type: array
                items:
                  $ref: '#/components/schemas/OpenSlot'

    SessionCoverageEntry:
      type: object
      additionalProperties: false
      required:
        [sessionId, classId, title, startAt, endAt, unavailableCoaches, coverage, coveringCoaches]
      properties:
        sessionId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        title:
          type: string
          description: Class name
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        unavailableCoaches:
          type: array
          description: Assigned coaches on leave on the session's facility day (at least one)
          items:
            type: object
            additionalProperties: false
            required: [coachId, fullName, leave]
            properties:
              coachId:
                type: string
                format: uuid
              fullName:
                type: string
                nullable: true
              leave:
                type: object
                additionalProperties: false
                required: [id, startDate, endDate, reason]
                properties:
                  id:
                    type: string
                    format: uuid
                  startDate:
                    type: string
                    format: date
                  endDate:
                    type: string
                    format: date
                  reason:
                    type: string
        coverage:
          type: string
          enum: [COVERED, UNCOVERED]
          description: COVERED when at least one assigned coach is not on leave that day
        coveringCoaches:
          type: array
          description: Assigned coaches not on leave that day; empty when UNCOVERED
          items:
            type: object
            additionalProperties: false
            required: [coachId, fullName]
            properties:
              coachId:
                type: string
                format: uuid
              fullName:
                type: string
                nullable: true

    Notification:
      type: object
      additionalProperties: false
      required: [id, type, title, body, data, readAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CLASS_CANCELLED]
        title:
          type: string
          example: Class cancelled
        body:
          type: string
          example: 'Your booking for Power Yoga on Tue, 1 Dec 2026, 10:00 was cancelled. 1 credit has been returned to your account.'
        data:
          type: object
          additionalProperties: true
          description: For `CLASS_CANCELLED`, `sessionId`, `classId` and `startAt` (ISO 8601 UTC)
          example:
            sessionId: 7b0c3a5e-2f0d-4f65-9a7f-1d3a9a0f2c11
            classId: 3f0e5f4e-8f3b-4c8a-9d52-1a2b3c4d5e6f
            startAt: '2026-12-01T06:00:00.000Z'
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Always present; null while unread
        createdAt:
          type: string
          format: date-time
