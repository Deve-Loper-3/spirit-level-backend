  /api/v1/coaches/{coachId}/unavailability:
    get:
      tags: [Coaches]
      summary: List a coach's unavailability (leave)
      description: |
        ADMIN or OWNER for any coach. A COACH may read only their own leave (another coach is 403).
        A MEMBER is 403.

        Sorted by `startDate`, then `id`. `from` / `to` (YYYY-MM-DD, inclusive) keep the leave that
        shares at least one date with that window; either can be sent alone. Unknown query
        parameters are 400. `note` is always present and is `null` when there is none. Dates are
        facility calendar dates, timestamps are ISO 8601 UTC.
      operationId: listCoachUnavailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CoachId'
        - name: from
          in: query
          description: Keep leave that ends on or after this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Keep leave that starts on or before this date (YYYY-MM-DD). Must not be before `from`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of leave
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [pagination]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoachUnavailability'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CoachNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Coaches]
      summary: Add a coach's unavailability (leave)
      description: |
        ADMIN or OWNER only (a COACH or MEMBER is 403).

        `startDate` and `endDate` (YYYY-MM-DD, inclusive facility calendar dates) and `reason` (free
        text, 1-200 characters) are required; `note` (max 1000, blank = `null`) is optional. There are
        no categories and no approval states.

        Rules: `endDate` must not be before `startDate`; `startDate` must be today or later in the
        facility timezone (400, `errors[].field` is `startDate`); the dates must not share a day with
        another leave of the same coach (409 `UNAVAILABILITY_OVERLAP`, the message and
        `details.conflict` name the existing range; adjacent ranges with no shared date are fine);
        unknown fields are 400.

        **No side effects:** adding leave never cancels, reassigns or changes a class session or an
        appointment. The response lists the upcoming, not-cancelled class sessions inside the leave
        that this coach is assigned to (`affectedSessions`, at most 100, in start order) and the full
        count (`affectedTotal`). `coverage` is `COVERED` when at least one OTHER assigned coach is not
        on leave on that facility day, otherwise `UNCOVERED`. An audit row
        (`COACH_UNAVAILABILITY_CREATED`) is written in the same transaction.
      operationId: createCoachUnavailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CoachId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoachUnavailabilityRequest'
            example:
              startDate: '2026-12-01'
              endDate: '2026-12-05'
              reason: Sick leave
              note: Doctor's note on file
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Coach unavailability created successfully
                      data:
                        $ref: '#/components/schemas/CoachUnavailabilityWithImpact'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CoachNotFound'
        '409':
          $ref: '#/components/responses/UnavailabilityConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Coaches
      summary: Not supported
      description: 'Every method other than GET, POST answers 405 with `Allow: GET, POST`.'
      operationId: methodNotAllowed_api_v1_coaches__coachId_unavailability
      responses:
        '405':
          description: 'Route exists but not for this method (`Allow: GET, POST`)'
          headers:
            Allow:
              description: Methods the route supports
              schema:
                type: string
                example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Method not allowed for this route
                code: METHOD_NOT_ALLOWED

  /api/v1/coaches/{coachId}/unavailability/{unavailabilityId}:
    patch:
      tags: [Coaches]
      summary: Edit a coach's unavailability (leave)
      description: |
        ADMIN or OWNER only (a COACH or MEMBER is 403). Send any subset of `startDate`, `endDate`,
        `reason`, `note` (at least one; a blank or `null` note clears it). The date rules run on the
        MERGED values (stored row + patch), so `{ "endDate": ... }` alone is checked against the stored
        `startDate`.

        What can change depends on the leave, by facility date:

        - **Not started yet** (`startDate` is today or later): every field; a changed date must not be in the past.
        - **Ongoing** (`startDate` before today, `endDate` today or later): `startDate` is locked (400,
          `errors[].field` is `startDate`); `endDate` can be extended or shortened, but not to a day before today;
          `reason` and `note` can change.
        - **Ended** (`endDate` before today): nothing can change (409 `UNAVAILABILITY_PAST_IMMUTABLE`).

        The result must not share a day with another leave of the same coach (409
        `UNAVAILABILITY_OVERLAP`); the row being edited is not compared with itself. A leave id that
        belongs to another coach is 404, like an unknown id.

        **No side effects:** no session or appointment changes. The response carries `affectedSessions`
        and `affectedTotal` for the NEW range, exactly as on POST. An audit row
        (`COACH_UNAVAILABILITY_UPDATED`: before / after dates and the changed field names) is written in
        the same transaction.
      operationId: updateCoachUnavailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CoachId'
        - $ref: '#/components/parameters/UnavailabilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCoachUnavailabilityRequest'
            example:
              endDate: '2026-12-09'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
