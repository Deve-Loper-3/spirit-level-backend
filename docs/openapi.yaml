  /api/v1/coaches/eligible:
    get:
      tags: [Coaches]
      summary: Which coaches can take a time slot
      description: |
        ADMIN or OWNER only (COACH and MEMBER are 403). A coach picker: every ACTIVE coach, sorted by name,
        with `eligible` and, when not eligible, the FIRST reason in `conflict`. Read only; the answer can be
        stale by the time the caller saves, because the save checks again under the coach's lock.

        Query: `startAt` (ISO 8601 with `Z` or a UTC offset) plus exactly one of `endAt` (then there are no
        buffers) or `appointmentTypeId` (then the end is `startAt` plus the type's duration and the type's
        buffers apply; an unknown type is 404, an inactive one 409). `excludeSessionId` /
        `excludeAppointmentId` leave that class session / appointment out of the check, so an item can be
        moved onto its own time. Unknown parameters are 400. There is no pagination.

        Rules, first failing wins: weekly availability, leave, class sessions (raw time), appointments (with
        buffers). See `CoachConflictType`. Cancelled sessions and appointments never block.
      operationId: listEligibleCoaches
      security:
        - bearerAuth: []
      parameters:
        - name: startAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endAt
          in: query
          description: Must be after `startAt`. Send this or `appointmentTypeId`, not both.
          schema:
            type: string
            format: date-time
        - name: appointmentTypeId
          in: query
          description: Send this or `endAt`, not both.
          schema:
            type: string
            format: uuid
        - name: excludeSessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: excludeAppointmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Every active coach with their eligibility
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EligibleCoach'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`APPOINTMENT_TYPE_NOT_FOUND` - the `appointmentTypeId` does not exist'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Appointment type not found
                code: APPOINTMENT_TYPE_NOT_FOUND
        '409':
          description: '`APPOINTMENT_TYPE_INACTIVE` - the type exists but is inactive'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: This appointment type is inactive and cannot be booked
                code: APPOINTMENT_TYPE_INACTIVE
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
