          type: string
          format: uuid
        timezone:
          type: string
          example: Asia/Dubai
          description: Facility timezone the HH:mm times are in
        isConfigured:
          type: boolean
          description: false until hours were saved once (then "hours not set" can be shown)
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Time of the last save (ISO 8601 UTC); null if never saved
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Always 7 entries in dayOfWeek order 1..7
          items:
            $ref: '#/components/schemas/AvailabilityDay'

